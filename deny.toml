# cargo-deny configuration. Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licences only. Anything not listed, including every copyleft licence
# (GPL, LGPL, AGPL, MPL, EPL, CDDL, EUPL, OSL), is refused.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# Workspace crates are not published; their licence is the workspace's Apache-2.0.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [{ crate = "serde_json" }]
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
