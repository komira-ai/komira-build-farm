# The users of the kbf-installer package (docs/design/kbf-installer.md, section 3).
# systemd-sysusers makes them at boot; `kbf-installer setup` does too. No maintainer
# script does. Each gets a group of its own name and no login.
#
# kbf: the runtime. Its state directory is /var/lib/kbf, made by the units.
u kbf - "kbf runtime" /var/lib/kbf /usr/sbin/nologin
# kbf-server: the frontend and storage units. Not kbf: the user builds run as must not
# read the state store, the operator token or the keys. Its state directory is
# /var/lib/kbf-server, made by the units.
u kbf-server - "kbf frontend and storage" /var/lib/kbf-server /usr/sbin/nologin
# kbf-fetch: runs the release download with no other privilege; owns only
# /var/cache/kbf-fetch/<random>, made per fetch and removed after.
u kbf-fetch - "kbf release download" /nonexistent /usr/sbin/nologin
# kbf-signer: owns the key that signs certificates and grants, so the frontend process
# cannot read it (section 3; frontend and all-in-one hosts use it). The package has one
# sysusers file for every host type, so the account exists on a node-only host too,
# where nothing runs as it. No home: the signer's unit makes its state directory.
u kbf-signer - "kbf certificate signer" /nonexistent /usr/sbin/nologin
# kbf-signer-clients: the accounts that may use the signer's socket and read the root
# (ca.pem), which `kbf-signer --client-group kbf-signer-clients` shares with this group:
# the socket is mode 0660 in a directory of mode 0750, both of this group. The signer is a
# member because it can only give a file to a group it belongs to, and the frontend
# (kbf-server) because it connects as a member. ca.key stays 0600 and the signer's own.
g kbf-signer-clients -
m kbf-signer kbf-signer-clients
m kbf-server kbf-signer-clients
