[package]
name = "kbf-it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `kbf-cell`, the M1 and M2 integration harnesses: the M1 and M2 tests themselves
# (`kbf-cell m1`, `kbf-cell m2`), test certificates, the test-only daemon (the daemon
# library with its local runtime) and the build-summary check; see the library docs.
[[bin]]
name = "kbf-cell"
path = "src/bin/kbf-cell.rs"

# `kbf-m2-act`, the program every action of the M2 sample project runs (`m2/`): the
# M2 image has no shell. Its verbs are kbf-testkit's (the standard library, rustix and
# two plain libc calls), so CI can still link it statically.
[[bin]]
name = "kbf-m2-act"
path = "src/bin/kbf-m2-act.rs"

[dependencies]
clap.workspace = true
kbf-deploy.workspace = true
kbf-daemon.workspace = true
kbf-objstore.workspace = true
kbf-testkit.workspace = true
kbf-transfer.workspace = true
rcgen.workspace = true
# `kbf-cell m1`'s calls to the operator API.
reqwest.workspace = true
# SIGINT for the processes `kbf-cell m1` started.
rustix = { workspace = true, features = ["process"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tonic.workspace = true
tracing-subscriber.workspace = true
# `kbf-cell m2` sets the runner up with `cargo xtask podman-tests`'s own function.
xtask.workspace = true

[dev-dependencies]
futures.workspace = true
hex.workspace = true
kbf-front.workspace = true
kbf-proto.workspace = true
kbf-server.workspace = true
kbf-threads.workspace = true
proc-macro2.workspace = true
prost.workspace = true
saphyr-parser.workspace = true
sha2.workspace = true
syn.workspace = true
# The real-Envoy tests (tests/envoy_box): stub servers and Envoy as a child process.
tokio = { workspace = true, features = ["io-util", "net", "process", "sync", "time"] }
tonic = { workspace = true, features = ["tls-ring"] }

[lints]
workspace = true
