[package]
name = "kbf-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The worker daemon: the `kbf_node` library (the flags, the driver set-up, the serve loop)
# and the thin `kbf-daemon` binary over it. It lives apart from the `kbf-daemon` library because it
# names the drivers, and the drivers depend on that library.
[[bin]]
name = "kbf-daemon"
path = "src/main.rs"

# A stand-in `podman` for tests/binary.rs (the container driver's start-up checks).
# Not shipped: the release jobs package the kbf-daemon binary alone.
[[bin]]
name = "kbf-podman-stub"
path = "src/bin/kbf-podman-stub.rs"
test = false

[dependencies]
clap.workspace = true
kbf-daemon.workspace = true
kbf-driver-native.workspace = true
kbf-outputs.workspace = true
kbf-threads.workspace = true
kbf-transfer.workspace = true
kbf-types.workspace = true
kbf-update.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The container driver runs rootless Podman under cgroup v2, and builds on Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
kbf-driver-container.workspace = true

[dev-dependencies]
futures.workspace = true
# The deploy docs' unit reader and the rendered deploy units (src/deploy_doc_tests.rs).
kbf-deploy.workspace = true
kbf-it.workspace = true
kbf-types.workspace = true
# The CAS the restart test's daemon reads its action from (tests/binary.rs).
kbf-front.workspace = true
kbf-proto.workspace = true
# The server the start-up test's daemon says Hello to (src/startup_tests.rs).
kbf-server.workspace = true
libc.workspace = true
prost.workspace = true
rcgen.workspace = true
serde_json.workspace = true
# What the unit tests give the daemon to run: kbf-testkit's act verbs and its fake
# xcrun, xcodebuild and sandbox-exec, through links to the test binary.
kbf-testkit.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time"] }

[lints]
workspace = true
