[package]
name = "kbf-all-in-one"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The farm server and a worker daemon in one process, the daemon's blobs moving through
# calls into the server (`LocalDataPlane`). The one crate that links both the server and
# the node library (crates/kbf-it/tests/layering.rs).
[[bin]]
name = "kbf-all-in-one"
path = "src/main.rs"

# The container driver's stand-in `crun`, which runs each action as a plain process,
# for tests/binary.rs: the same program the driver's own tests run
# (crates/kbf-driver-container/tests/bin/fake_crun.rs), built here because a test
# can run only its own package's binaries. Also what a `podman` that must never run
# is. Not shipped.
[[bin]]
name = "kbf-fake-crun"
path = "../kbf-driver-container/tests/bin/fake_crun.rs"
test = false

[dependencies]
bytes.workspace = true
clap.workspace = true
futures.workspace = true
kbf-front.workspace = true
kbf-node.workspace = true
kbf-proto.workspace = true
kbf-segments.workspace = true
kbf-server.workspace = true
# The node's one cache (`kbf_storage::local_cache`) and the streamed read's types.
kbf-storage.workspace = true
kbf-threads.workspace = true
kbf-transfer.workspace = true
kbf-types.workspace = true
# The stand-in `crun`'s (kbf-fake-crun).
rustix = { workspace = true, features = ["process"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt-multi-thread", "sync"] }
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The checks every data plane must pass (tests/conformance.rs).
kbf-cas-conformance.workspace = true
# The CPU pool the output walk hashes on (tests/one_read.rs).
kbf-daemon.workspace = true
# The driver's output walk (tests/memory.rs, tests/one_read.rs).
kbf-driver-container.workspace = true
# The storage boundary the plane is checked through (tests/storage_seam.rs); where a blob is, to damage one (src/plane_tests.rs).
kbf-meta.workspace = true
# The store a blob is in, to damage one (src/plane_tests.rs).
kbf-objstore.workspace = true
# The act steps the stand-in `crun` runs as each action, through this test binary.
kbf-testkit.workspace = true
prost.workspace = true
rcgen.workspace = true
# inotify, which counts the opens of each output file (tests/one_read.rs).
rustix = { workspace = true, features = ["fs"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "time"] }

[lints]
workspace = true
