[package]
name = "kbf-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The storage part of the farm (docs/design/architecture-v2.md, sections 3 and 13 P2):
# the `Storage` trait and its error, which the front, the server and the combined binary
# call the cache through, and the gRPC service that serves one (`service`) with the client
# that calls it. Never the frontend's crates: no scheduler, no
# authorization (crates/kbf-it/tests/layering.rs).
[dependencies]
bytes.workspace = true
crc32c.workspace = true
futures.workspace = true
kbf-map.workspace = true
kbf-meta.workspace = true
# Reads the role out of a peer's certificate (service/admission.rs), the one reader the
# worker listener uses too.
kbf-peer.workspace = true
kbf-proto.workspace = true
kbf-segments.workspace = true
kbf-store.workspace = true
kbf-tls.workspace = true
kbf-types.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tonic = { workspace = true, features = ["tls-ring"] }
tracing.workspace = true

[dev-dependencies]
rcgen.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }

[lints]
workspace = true
