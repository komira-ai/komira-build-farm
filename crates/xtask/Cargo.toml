[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# `cargo xtask` runs this bin, not the test fake.
default-run = "xtask"

# `xtask-fake`, the program this crate's tests run in place of `cargo` and of a built
# `kbf-server` (see its docs). Never run by CI itself.
[[bin]]
name = "xtask-fake"
path = "src/bin/xtask-fake.rs"
test = false

[dependencies]
clap.workspace = true
flate2.workspace = true
hex.workspace = true
lzma-rs.workspace = true
ruzstd.workspace = true
# The runner user's uid and gid, and `uname -m`, for `crun-tests`.
rustix = { workspace = true, features = ["process", "system"] }
serde_json.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
ureq.workspace = true

[dev-dependencies]
rcgen.workspace = true

[lints]
workspace = true
