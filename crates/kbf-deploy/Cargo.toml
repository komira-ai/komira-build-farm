[package]
name = "kbf-deploy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The deploy tool: its kits as subcommands. A kit that changes a host does it through
# kbf-host's plan of steps, printed by default and carried out with `--apply`. Five
# kits: `minio` (buckets and their key, a NodePort for the S3 port), `linux`
# (render-units, check-units, and as root install-units and swap), `mdm`
# (fetch the pinned upstream archives; as root install the MDM services, the TLS
# certificate, the push certificate and the enrollment profile, and link NanoDEP to
# Apple Business Manager; verify them; sign an operator's erase request), `envoy`
# (render, check a render, and apply it to a cluster through kubectl) and `pilot`
# (server-install, a kbf-server as a systemd user service, and buckconfig, a
# worktree's buck2 overlay).
# rustls (ring), httparse and rustls-native-certs make the HTTPS client of `mdm fetch`,
# `mdm verify` and `mdm tls --check-godaddy`; rustls loads the push certificate's key
# to match it to the certificate, and checks `pilot server-install`'s server
# certificate and key; sha2 checks the archives against their pins and hashes the
# rendered Envoy config into the pod template; zip, tar and flate2 unpack the archives;
# x509-parser reads the certificates `mdm` checks; plist writes the enrollment profile;
# base64 encodes the Basic auth of the MDM services' APIs.
# `mdm erase-request` writes and checks the request with kbf-mdm's own parser and
# signature check, and reads the security key's public half with ssh-key.
# `host state-backup` and `host state-restore` work on the SQLite state store's file
# through kbf-state's own backup, check, lock and restore; time stamps the kept file.

[[bin]]
name = "kbf-deploy"
path = "src/main.rs"

[dependencies]
base64.workspace = true
clap.workspace = true
flate2.workspace = true
hex.workspace = true
httparse.workspace = true
kbf-host.workspace = true
kbf-mdm.workspace = true
kbf-state.workspace = true
kbf-types.workspace = true
plist.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ssh-key.workspace = true
tar.workspace = true
thiserror.workspace = true
time.workspace = true
x509-parser.workspace = true
zip.workspace = true

[dev-dependencies]
kbf-host = { workspace = true, features = ["testkit"] }
# Security-key signatures made in software, for `mdm erase-request`'s tests.
kbf-mdm = { workspace = true, features = ["testkit"] }
# The certificates of the HTTPS servers the `mdm` tests run, and the ones
# `linux verify-cert` is tested against.
rcgen.workspace = true
rustix = { workspace = true, features = ["process"] }
# Databases a state restore must refuse: another application's, a damaged one.
rusqlite.workspace = true

[lints]
workspace = true
