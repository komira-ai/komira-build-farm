# Rendered by `kbf-deploy linux render-units`; installed as
# /etc/systemd/system/minio.service.d/kbf.conf. MinIO's own unit stays as its
# installation wrote it; this drop-in puts it first in the host's priorities.
[Service]
Slice=kbf.slice
# MinIO's peak use (MINIO_RESERVATION_GIB): never reclaimed while it uses no more.
MemoryMin=32G
# Its pages stay in RAM: the host's swap is for builds.
MemorySwapMax=0
# The lowest score of the host's processes: the last a host-wide OOM kills.
OOMScoreAdjust=-950
CPUWeight=400
