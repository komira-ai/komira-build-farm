# The role a peer's certificate names (docs/design/architecture-v2.md, section 9): the one
# reader of `urn:kbf:role:<name>`, for every listener that takes a client certificate (the
# storage service, the worker listener) and for tools that check a certificate before it
# is installed; and the DNS and IP names it carries (the storage node's membership checks
# them against its instance id and address). No gRPC: each caller says which status a
# refusal is.
