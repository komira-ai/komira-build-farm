[package]
name = "kbf-history"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
# The CRC-32C of each block and of the footer.
crc32c.workspace = true
# `try_join_all`: a page of chunk reads in parallel, with no runtime.
futures.workspace = true
hex.workspace = true
# The `ObjectStore` trait history objects are written through, and its key types.
kbf-objstore.workspace = true
# The `Store` trait the `ui/` index rows are written through.
kbf-state.workspace = true
# The records and index rows, as derived protobuf messages (no code generation step).
prost.workspace = true
# The zstd blocks; pure Rust, already in the tree through xtask.
ruzstd.workspace = true
# The invocation key (first 8 bytes of SHA-256).
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The in-memory state store the index tests run on (tests/history/support.rs).
kbf-state = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
