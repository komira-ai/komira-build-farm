# A node's containers.conf that differs from Podman's defaults, for tests/podman_env.rs
# (tools/ci/podman-tests-inner.sh names it in CONTAINERS_CONF_OVERRIDE). The driver
# passes each of these settings itself, so none of them may reach an action.
[containers]
env = ["KBF_FROM_CONTAINERS_CONF=1"]
pids_limit = 999
shm_size = "3m"
default_ulimits = ["nofile=777:777", "nproc=888:888"]
