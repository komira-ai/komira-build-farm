[package]
name = "kbf-driver-container"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The tests' stand-in `crun` (tests/support/fake.rs links it).
# Not shipped: the release jobs build only kbf-node's and kbf-server's binaries.
[[bin]]
name = "kbf-fake-crun"
path = "tests/bin/fake_crun.rs"
test = false

[dependencies]
async-trait.workspace = true
clap.workspace = true
futures.workspace = true
hex.workspace = true
kbf-daemon.workspace = true
kbf-image.workspace = true
kbf-proto.workspace = true
kbf-types.workspace = true
oci-spec.workspace = true
prost.workspace = true
prost-types.workspace = true
runc.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
flate2.workspace = true
kbf-front.workspace = true
kbf-objstore.workspace = true
# The fake crun's actions: kbf-testkit's act steps, run by the test binary itself.
kbf-testkit.workspace = true
kbf-transfer.workspace = true
# sched_getaffinity, which the real-crun capacity test compares with.
rustix = { workspace = true, features = ["thread"] }
tar.workspace = true
tokio-rustls.workspace = true
tonic.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
