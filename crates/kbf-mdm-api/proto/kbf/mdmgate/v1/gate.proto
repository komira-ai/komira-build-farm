// kbf.mdmgate.v1: what kbf-server asks of kbf-mdm-gate (docs/design/mdm-backend.md
// section M2.2, fleet-updates-security.md section S5.2).
//
// The gate listens only to kbf-server, over mutual TLS pinned to the server's
// identity. This service carries the verbs that change no Mac's data: `status`
// (inventory, DDM status and Apple's catalogue), `enforce` and `withdraw` of one
// macOS build, and `profile` (an allowlisted profile, named by its digest). It has
// no erase verb, no raw MDM command and no pass-through: the server cannot ask for
// an erase here. The server's other gate verbs (`grant-admin`, the relay of an
// operator-signed erase, `bring-forward`) are not part of this service.
//
// Every refusal is an answer, not a transport error: a call the gate understood and
// refused returns `Refusal` with a reason, so the server can tell "the gate said no"
// from "the gate could not be reached".
syntax = "proto3";

package kbf.mdmgate.v1;

service MdmGate {
  // Inventory: every Mac in the gate's inventory (or the serials asked for), with
  // what the MDM last heard from it, and Apple's catalogue as the gate last read it.
  rpc Status(StatusRequest) returns (StatusResponse);
  // Posts one `softwareupdate.enforcement.specific` declaration for one Mac, for
  // exactly the build the signed set names.
  rpc Enforce(EnforceRequest) returns (EnforceResponse);
  // Removes the Mac's outstanding kbf enforcement, if any.
  rpc Withdraw(WithdrawRequest) returns (WithdrawResponse);
  // Installs one profile the gate already holds, named by its SHA-256.
  rpc Profile(ProfileRequest) returns (ProfileResponse);
}

message StatusRequest {
  // The serials to report. Empty: every Mac in the gate's inventory. A serial the
  // gate does not know is left out of the answer.
  repeated string serials = 1;
}

message StatusResponse {
  repeated MacStatus macs = 1;
  // Apple's public catalogue (gdmf.apple.com/v2/pmv), as the gate last read it.
  Catalogue catalogue = 2;
}

// One Mac, as the MDM last heard from it. An empty string is a value the MDM has
// not received.
message MacStatus {
  // The hardware serial, from Apple Business Manager.
  string serial = 1;
  // The platform UUID, from the Mac's first enrollment.
  string platform_uuid = 2;
  // The pool the gate's configuration puts it in.
  string pool = 3;
  bool enrolled = 4;
  bool supervised = 5;
  bool bootstrap_token_escrowed = 6;
  // The last MDM check-in, milliseconds since the Unix epoch; 0 if none.
  uint64 last_check_in_unix_ms = 7;
  // DDM `device.operating-system.version` / `.build-version` /
  // `.supplemental.build-version`.
  string os_version = 8;
  string os_build = 9;
  string supplemental_build = 10;
  // The DDM software-update status items (mdm-backend.md section M3).
  SoftwareUpdateStatus software_update = 11;
  // The profiles installed on it.
  repeated InstalledProfile profiles = 12;
  // The kbf enforcement outstanding on it; absent when there is none. The server's
  // startup reconciliation (fleet-updates.md section 4.1) reads it.
  Enforcement enforcement = 13;
}

// The latest values of the DDM software-update status items.
message SoftwareUpdateStatus {
  // `softwareupdate.install-state`, for example `downloading` or `installing`.
  string install_state = 1;
  // `softwareupdate.pending-version`: `os-version` and `build-version`.
  string pending_os_version = 2;
  string pending_build = 3;
  // `softwareupdate.failure-reason`: `reason`, and how many times it failed.
  string failure_reason = 4;
  uint32 failure_count = 5;
  // `softwareupdate.install-reason`: `reason`.
  repeated string install_reasons = 6;
}

message InstalledProfile {
  // The profile's identifier.
  string identifier = 1;
  // Its SHA-256 in lower-case hex, where the gate installed it; empty otherwise.
  string sha256 = 2;
}

// One outstanding enforcement: the declaration the gate posted for one Mac.
message Enforcement {
  // Always `kbf.osupdate.<serial>`.
  string declaration_identifier = 1;
  string target_os_version = 2;
  string target_build = 3;
  // `TargetLocalDateTime`: `YYYY-MM-DDTHH:MM:SS`, the Mac's local time.
  string target_local_date_time = 4;
}

message Catalogue {
  // When the gate last read it successfully, milliseconds since the Unix epoch; 0 if
  // it never has (then `entries` is empty).
  uint64 fetched_at_unix_ms = 1;
  repeated CatalogueEntry entries = 2;
}

// One macOS release Apple's catalogue lists.
message CatalogueEntry {
  string product_version = 1;
  string build = 2;
  // `YYYY-MM-DD`.
  string posting_date = 3;
  // `YYYY-MM-DD`. After it the build can no longer be enforced.
  string expiration_date = 4;
  // Apple's board identifiers it installs on.
  repeated string supported_devices = 5;
  // Listed in `PublicAssetSets` (true) or only in `AssetSets` (false).
  bool public = 6;
}

message EnforceRequest {
  string serial = 1;
  // The signed software set, as signed. The gate checks it (S3.1, less what needs the
  // node) and enforces the macOS version and build it names; the server sends no
  // build of its own.
  bytes signed_set = 2;
  // `TargetLocalDateTime`: `YYYY-MM-DDTHH:MM:SS`.
  string target_local_date_time = 3;
}

message EnforceResponse {
  oneof outcome {
    // What the gate posted.
    Enforcement enforced = 1;
    Refusal refused = 2;
  }
}

message WithdrawRequest {
  string serial = 1;
}

message WithdrawResponse {
  oneof outcome {
    Withdrawn withdrawn = 1;
    Refusal refused = 2;
  }
}

message Withdrawn {
  // The enforcement removed; absent if none was outstanding (withdrawing is
  // idempotent).
  Enforcement removed = 1;
}

message ProfileRequest {
  string serial = 1;
  // The profile's SHA-256 in lower-case hex. The server never sends profile bytes.
  string sha256 = 2;
}

message ProfileResponse {
  oneof outcome {
    ProfileInstalled installed = 1;
    Refusal refused = 2;
  }
}

message ProfileInstalled {
  // The installed profile's identifier.
  string identifier = 1;
}

message Refusal {
  RefusalReason reason = 1;
  // For the operator: what the gate checked and found.
  string detail = 2;
}

enum RefusalReason {
  REFUSAL_REASON_UNSPECIFIED = 0;
  // The serial is not in the gate's inventory.
  REFUSAL_REASON_UNKNOWN_SERIAL = 1;
  // The signed set failed a check: signature, key, pool or platform, expiry, or the
  // gate's per-pool serial floor.
  REFUSAL_REASON_SET_REJECTED = 2;
  // Another enforcement in the same pool is outstanding.
  REFUSAL_REASON_ENFORCEMENT_OUTSTANDING = 3;
  // The Macs checked in and not being erased or updated would drop below the floor.
  REFUSAL_REASON_BELOW_FLOOR = 4;
  // No verified signed set and no allowlist entry names the profile's digest.
  REFUSAL_REASON_NOT_ALLOWLISTED = 5;
  // The declaration it would change does not start with `kbf.`.
  REFUSAL_REASON_NOT_KBF_DECLARATION = 6;
  // The Mac cannot take it: not supervised, not enrolled, or no bootstrap token.
  REFUSAL_REASON_INELIGIBLE = 7;
  // A field is malformed (a serial, a date-time, a digest).
  REFUSAL_REASON_BAD_REQUEST = 8;
}
