[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira-build-farm"
publish = false

# Every external dependency is declared here once and used from a member as
# `name.workspace = true` (members add features they need). Declaring the likely set
# ahead keeps version choices in one place. A dependency enters Cargo.lock only when
# a member first uses it.
[workspace.dependencies]
# The operator API's HTTP server (kbf-server). Already in the tree through tonic; no
# default features: no form, query or json extractors, whose parsers are not needed.
axum = { version = "0.8.9", default-features = false }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
# macOS only (kbf-mac-session): CFData for the caller's audit token.
core-foundation = "0.10.1"
# The MDM gate's grant key (kbf-mdm) and the Mac's check of the grants it signs
# (kbf-mac-session: pure Rust, so the helper is checked for the macOS target on any
# host, which ring's C build does not allow). One major for both, already in the tree
# through ssh-key.
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
futures = "0.3.34"
hex = "0.4.3"
# `wait4` and `kill` for a measured child process (kbf-daemon's `usage` module); the
# standard library reaps children without returning their resource usage.
libc = "0.2.190"
hmac = "0.13.0"
# The MDM gate serves its mutual-TLS listener with hyper directly (axum's own `serve`
# takes plain TCP only). Both are already in the tree through axum and tonic.
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
md-5 = "0.11.0"
# macOS only (kbf-mac-session): OpenDirectory, for the per-lease users.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-open-directory = { version = "0.3.2", default-features = false, features = ["std"] }
prost = "0.14.4"
prost-types = "0.14.4"
protox = "0.9.1"
rand = "0.10.3"
rand_chacha = "0.10.0"
# Test certificates only. ring is the crypto provider tonic's `tls-ring` uses too.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# Plain HTTP only: TLS brings a crypto provider, added with the first TLS endpoint.
reqwest = { version = "0.13.5", default-features = false }
# ed25519 checks of software sets and key statements (kbf-updater). Already in the tree
# through rustls.
ring = "0.17.14"
roxmltree = "0.21.1"
# The MDM gate's mutual-TLS listener, on the ring provider tonic's `tls-ring` uses too.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
# Directory-relative, no-follow file access (openat with O_NOFOLLOW) for reading outputs;
# the effective uid, to check who owns the operator API token file (kbf-server).
rustix = "1.1.5"
saphyr-parser = "0.1.0"
# macOS only (kbf-mac-session): the caller's code signature against a pinned
# requirement (SecCodeCopyGuestWithAttributes, SecCodeCheckValidity).
security-framework = { version = "3.7.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
# OpenSSH signatures (`ssh-keygen -Y sign`) on operator erase requests (kbf-mdm): the
# SSHSIG envelope and security-key (`sk-`) signature verification.
ssh-key = { version = "0.6.7", default-features = false, features = ["alloc", "ed25519", "p256", "std"] }
# Constant-time comparison of the operator API token (kbf-server). Already in the tree
# through rustls.
subtle = "2.6.1"
thiserror = "2.0.21"
# RFC 3339 times in the MDM gate's signed messages. Already in the tree through
# x509-parser.
time = { version = "0.3.55", default-features = false, features = ["formatting", "macros", "parsing", "std"] }
tokio = "1.53.2"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
# The REAPI authentication layer (kbf-auth). Already in the tree through tonic.
tower-layer = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# Reads the fields of a daemon's client certificate the worker listener checks (its DNS
# subjectAltName, serial and public key); TLS has already verified the certificate.
x509-parser = "0.18.1"

kbf-alert = { path = "crates/kbf-alert" }
kbf-auth = { path = "crates/kbf-auth" }
kbf-caps = { path = "crates/kbf-caps" }
kbf-daemon = { path = "crates/kbf-daemon" }
kbf-driver-container = { path = "crates/kbf-driver-container" }
kbf-driver-native = { path = "crates/kbf-driver-native" }
kbf-estimator = { path = "crates/kbf-estimator" }
kbf-front = { path = "crates/kbf-front" }
kbf-mac-session = { path = "crates/kbf-mac-session" }
kbf-mdm = { path = "crates/kbf-mdm" }
kbf-mdm-api = { path = "crates/kbf-mdm-api" }
kbf-meta = { path = "crates/kbf-meta" }
kbf-objstore = { path = "crates/kbf-objstore" }
kbf-outputs = { path = "crates/kbf-outputs" }
kbf-proto = { path = "crates/kbf-proto" }
kbf-raft = { path = "crates/kbf-raft" }
kbf-sched = { path = "crates/kbf-sched" }
kbf-segments = { path = "crates/kbf-segments" }
kbf-server = { path = "crates/kbf-server" }
kbf-sim = { path = "crates/kbf-sim" }
kbf-sim-cell = { path = "crates/kbf-sim-cell" }
kbf-store = { path = "crates/kbf-store" }
kbf-types = { path = "crates/kbf-types" }

# `clippy.toml` lists the clock, sleep, network and hashed-collection items that pure
# crates must not use. They are allowed workspace-wide; each pure crate denies them in
# its `lib.rs` (an in-source attribute overrides this table), and the layering test in
# `kbf-it` checks that the deny is present.
[workspace.lints.clippy]
disallowed_methods = "allow"
disallowed_types = "allow"
