[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/komira-ai/komira-build-farm"
publish = false

# Every external dependency is declared here once and used from a member as
# `name.workspace = true` (members add features they need). Declaring the likely set
# ahead keeps version choices in one place. A dependency enters Cargo.lock only when
# a member first uses it.
[workspace.dependencies]
# `Io` and `Spawner` of the `runc` client (below) are async traits; the container driver
# implements both. Already in the tree through runc.
async-trait = "0.1.92"
# The operator API's HTTP server (kbf-server). Already in the tree through tonic; no
# default features: no form, query or json extractors, whose parsers are not needed.
axum = { version = "0.8.9", default-features = false }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
# The hardware CRC-32C (SSE4.2 / ARMv8) of segment records (kbf-segments), with a portable
# fallback; the same values as the table the crate had before.
crc32c = "0.6.8"
# The CRC-32 of the worker input cache's index snapshot (kbf-daemon). Already in the
# tree through flate2.
crc32fast = "1.5.2"
# macOS only (kbf-mac-session): CFData for the caller's audit token.
core-foundation = "0.10.1"
# The MDM gate's grant key (kbf-mdm) and the Mac's check of the grants it signs
# (kbf-mac-session: pure Rust, so the helper is checked for the macOS target on any
# host, which ring's C build does not allow). One major for both, already in the tree
# through ssh-key.
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
# gzip for the tar.gz archives kbf-deploy installs (`mdm install`) and `cargo xtask
# fetch` unpacks, and the deflate behind zip (below); the pure-Rust backend, no C zlib.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
# The query of the operator API's blob route (kbf-server): `?instance=&name=`, decoded as
# a browser encodes it. Already in the tree through url.
form_urlencoded = "1.2.2"
futures = "0.3.34"
hex = "0.4.3"
# The status line and headers of an HTTPS answer (kbf-deploy: `mdm fetch`, `mdm verify`).
# Already in the tree through hyper.
httparse = "1.10.1"
# The frontend proxy's pass-through bodies (kbf-front); already in the tree through tonic.
http-body = "1.1.0"
# `wait4` and `kill` for a measured child process (kbf-daemon's `usage` module); the
# standard library reaps children without returning their resource usage.
libc = "0.2.190"
# xz for the tar.xz archives `cargo xtask fetch` unpacks; pure Rust, no C liblzma.
lzma-rs = "0.3.0"
hmac = "0.13.0"
# The state store's Postgres backend (kbf-state, feature `postgres`): the blocking client,
# no TLS (an `sslmode=require` URL is refused rather than downgraded).
postgres = "0.19.10"
# The MDM gate serves its mutual-TLS listener with hyper directly (axum's own `serve`
# takes plain TCP only). Both are already in the tree through axum and tonic.
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
md-5 = "0.11.0"
# macOS only (kbf-mac-session): OpenDirectory, for the per-lease users.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-open-directory = { version = "0.3.2", default-features = false, features = ["std"] }
# Typed OCI runtime configuration (`config.json`) for the container driver's crun
# backend. The 0.7 line is the one `runc` (below) uses, so the tree holds one copy.
oci-spec = "0.7.1"
# The enrollment profile kbf-deploy writes (`mdm push-cert`), an XML property list.
# No default features: the profile is built as a value, not through serde.
plist = { version = "1.10.1", default-features = false }
# The token trees of syn (below). Already in the tree through the derive macros.
proc-macro2 = "1.0.107"
prost = "0.14.4"
prost-types = "0.14.4"
# Message-only code for a proto with no gRPC service (kbf-invocation). Already in the
# tree through tonic-prost-build.
prost-build = "0.14.4"
# The RFC 8187 `filename*` of the blob route's Content-Disposition (kbf-server). Already in
# the tree through axum.
percent-encoding = "2.3.2"
protox = "0.9.1"
rand = "0.10.3"
rand_chacha = "0.10.0"
# Test certificates only. ring is the crypto provider tonic's `tls-ring` uses too.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# Plain HTTP only: TLS brings a crypto provider, added with the first TLS endpoint.
reqwest = { version = "0.13.5", default-features = false }
# ed25519 checks of software sets and key statements (kbf-updater). Already in the tree
# through rustls.
ring = "0.17.14"
roxmltree = "0.21.1"
# The MDM gate's mutual-TLS listener, on the ring provider tonic's `tls-ring` uses too.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
# The host's trusted roots for kbf-deploy's HTTPS downloads and checks (`mdm fetch`,
# `mdm verify`) and `cargo xtask fetch`'s.
rustls-native-certs = "0.8.4"
# zstd for the .zst downloads `cargo xtask fetch` unpacks; pure Rust, no C zstd.
ruzstd = "0.9.1"
# The OCI runtime client (containerd/rust-extensions) the container driver's crun backend
# drives `crun` through: run, kill and delete. The async client; the crate has no
# synchronous client in the same build.
runc = { version = "0.3.0", features = ["async"] }
# The SQLite state store (kbf-state): the C library is compiled in (`bundled`), so the file
# format and WAL behaviour do not depend on the host's libsqlite3; `hooks` for the commit
# counter. No default features: no statement cache (hashlink) and no wasm shim.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
# Directory-relative, no-follow file access (openat with O_NOFOLLOW) for reading outputs;
# the effective uid, to check who owns the operator API token file (kbf-server).
rustix = "1.1.5"
saphyr-parser = "0.1.0"
# macOS only (kbf-mac-session): the caller's code signature against a pinned
# requirement (SecCodeCopyGuestWithAttributes, SecCodeCheckValidity).
security-framework = { version = "3.7.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The fixed-key hash behind the storage map's rendezvous scores (kbf-map): SipHash-2-4 with a
# specified output, so an owner list is the same on every build and platform. Already in the
# tree through another crate; MIT OR Apache-2.0.
siphasher = "1.0.4"
sha2 = "0.11.0"
# OpenSSH signatures (`ssh-keygen -Y sign`) on operator erase requests (kbf-mdm): the
# SSHSIG envelope and security-key (`sk-`) signature verification.
ssh-key = { version = "0.6.7", default-features = false, features = ["alloc", "ed25519", "p256", "std"] }
# Constant-time comparison of the operator API token (kbf-server). Already in the tree
# through rustls.
subtle = "2.6.1"
# Parses Rust sources for the interpreter budget's shell scan (kbf-it, tests only).
# Already in the tree through the derive macros.
syn = { version = "2.0.119", default-features = false, features = ["full", "parsing", "visit"] }
# The tar archives kbf-deploy installs (`mdm install`) and `cargo xtask fetch` unpacks;
# no extended attributes.
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
# `kbf.toml`, the node's config file (kbf-enroll); no datetime or display support.
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
# RFC 3339 times in the MDM gate's signed messages. Already in the tree through
# x509-parser.
time = { version = "0.3.55", default-features = false, features = ["formatting", "macros", "parsing", "std"] }
tokio = "1.53.2"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
# The REAPI authentication layer (kbf-auth). Already in the tree through tonic.
tower-layer = "0.3.3"
# The connector kbf-enroll hands tonic to dial the frontend under a pinned CA. Already in
# the tree through tonic.
tower-service = "0.3.3"
tracing = "0.1.44"
tracing-core = "0.1.36"
tracing-subscriber = "0.3.23"
# HTTPS downloads for `cargo xtask fetch`, over the rustls (ring) above: no provider
# feature, so neither aws-lc-rs nor the bundled webpki roots (CDLA licence) come in;
# the agent is given ring and the host's roots.
ureq = { version = "3.4.2", default-features = false, features = ["rustls-no-provider"] }
# Reads the fields of a peer's client certificate the listeners check (its role URI,
# kbf-peer; a daemon's DNS subjectAltName, serial and public key, kbf-server); TLS has
# already verified the certificate.
x509-parser = "0.18.1"
# The zip archives kbf-deploy installs (`mdm install`): deflate only, through flate2.
# Overwrites the object-store keys a storage node holds when they are dropped (kbf-enroll).
# Already in the tree through rustls.
zeroize = "1.9.1"
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2"] }

kbf-alert = { path = "crates/kbf-alert" }
kbf-all-in-one = { path = "crates/kbf-all-in-one" }
kbf-auth = { path = "crates/kbf-auth" }
kbf-caps = { path = "crates/kbf-caps" }
kbf-cas-conformance = { path = "crates/kbf-cas-conformance" }
kbf-daemon = { path = "crates/kbf-daemon" }
kbf-deploy = { path = "crates/kbf-deploy" }
kbf-driver-container = { path = "crates/kbf-driver-container" }
kbf-driver-native = { path = "crates/kbf-driver-native" }
kbf-enroll = { path = "crates/kbf-enroll" }
kbf-estimator = { path = "crates/kbf-estimator" }
kbf-front = { path = "crates/kbf-front" }
kbf-history = { path = "crates/kbf-history" }
kbf-host = { path = "crates/kbf-host" }
kbf-invocation = { path = "crates/kbf-invocation" }
kbf-it = { path = "crates/kbf-it" }
kbf-log = { path = "crates/kbf-log" }
kbf-map = { path = "crates/kbf-map" }
kbf-mapsync = { path = "crates/kbf-mapsync" }
kbf-mac-session = { path = "crates/kbf-mac-session" }
kbf-mdm = { path = "crates/kbf-mdm" }
kbf-mdm-api = { path = "crates/kbf-mdm-api" }
kbf-meta = { path = "crates/kbf-meta" }
kbf-node = { path = "crates/kbf-node" }
kbf-objstore = { path = "crates/kbf-objstore" }
kbf-outputs = { path = "crates/kbf-outputs" }
kbf-peer = { path = "crates/kbf-peer" }
kbf-proto = { path = "crates/kbf-proto" }
kbf-raft = { path = "crates/kbf-raft" }
kbf-route = { path = "crates/kbf-route" }
kbf-sched = { path = "crates/kbf-sched" }
kbf-segments = { path = "crates/kbf-segments" }
kbf-server = { path = "crates/kbf-server" }
kbf-sim = { path = "crates/kbf-sim" }
kbf-sim-cell = { path = "crates/kbf-sim-cell" }
kbf-state = { path = "crates/kbf-state" }
kbf-storage = { path = "crates/kbf-storage" }
kbf-store = { path = "crates/kbf-store" }
kbf-testkit = { path = "crates/kbf-testkit" }
kbf-threads = { path = "crates/kbf-threads" }
kbf-tls = { path = "crates/kbf-tls" }
kbf-tier = { path = "crates/kbf-tier" }
kbf-transfer = { path = "crates/kbf-transfer" }
kbf-types = { path = "crates/kbf-types" }
kbf-ui = { path = "crates/kbf-ui" }
# The CI verbs (`cargo xtask`); kbf-it reads the interpreter budget with its parser.
xtask = { path = "crates/xtask" }

# `clippy.toml` lists the clock, sleep, network and hashed-collection items that pure
# crates must not use. They are allowed workspace-wide; each pure crate denies them in
# its `lib.rs` (an in-source attribute overrides this table), and the layering test in
# `kbf-it` checks that the deny is present.
[workspace.lints.clippy]
disallowed_methods = "allow"
disallowed_types = "allow"

# Dev and test builds: a test binary with full debug info is ~0.5 GB and a target
# directory holds thousands of them, plus incremental state. Line tables keep panic
# backtraces and profilers at file:line; variable-level debug info is the part dropped.
# `test` inherits `dev`; it is spelled out so the two cannot drift. Release is untouched.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
