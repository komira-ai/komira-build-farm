# The XCUITest fixtures (tools/spike/macos/fixtures) as a native driver action that
# asks for the network: `xcodebuild` under the sandbox profile the driver's library
# builds, in a lease directory with the lease's variables, with the deny lines the
# sandbox logs for the run's processes read back
# (crates/kbf-driver-native/tests/xcuitest_sandbox.rs; findings:
# docs/spikes/macos-p0.md). The tests pin what the hosted runner measured: the iOS
# fixture passes under the profile, the macOS UI tests stop on `(deny lsopen)`, and
# each run is refused what the profile denies. Controls: `sandbox-exec` must refuse a
# run under `(deny default)`, and both fixtures must pass without a sandbox. Also the
# fixtures' pixel checker against synthetic images.
# This proves the instrument and the profile on a hosted runner only: its privacy (TCC)
# grants may be seeded, so a pass says nothing about a fresh Mac. The leases, the
# xcodebuild logs, the result bundles and each run's deny lines are uploaded.
# Run by hand, or on a pull request that changes this file, the fixtures, the test or
# the driver code the profile, the lease's variables and the process tree come from.
name: spike-xcuitest

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/spike-xcuitest.yml
      - tools/spike/macos/fixtures/**
      - crates/kbf-driver-native/tests/xcuitest_sandbox.rs
      - crates/kbf-driver-native/tests/support/xcode_fixture.rs
      - crates/kbf-driver-native/src/home.rs
      - crates/kbf-driver-native/src/network.rs
      - crates/kbf-driver-native/src/procs.rs
      - crates/kbf-driver-native/src/user_folders.rs
  push:
    branches: [feature/arch-v2]
    paths:
      - .github/workflows/spike-xcuitest.yml
      - tools/spike/macos/fixtures/**
      - crates/kbf-driver-native/tests/xcuitest_sandbox.rs
      - crates/kbf-driver-native/tests/support/xcode_fixture.rs
      - crates/kbf-driver-native/src/home.rs
      - crates/kbf-driver-native/src/network.rs
      - crates/kbf-driver-native/src/procs.rs
      - crates/kbf-driver-native/src/user_folders.rs

permissions: {}

concurrency:
  group: spike-xcuitest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcuitest-sandbox:
    # Not run for a pull request into feature/arch-v2; it runs on pushes to it, on pull
    # requests into any other branch, and by hand.
    if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feature/arch-v2' }}
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sw_vers
      - run: uname -m
      - run: xcodebuild -version
      - run: xcrun simctl list runtimes
      - run: rustup toolchain install
      - name: The fixtures under the driver's sandbox, with controls
        run: cargo test -p kbf-driver-native --test xcuitest_sandbox --locked -- --ignored --nocapture
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: xcuitest-sandbox
          path: |
            target/tmp/xcuitest/*-denies.txt
            target/tmp/xcuitest/*/root/out/*-xcodebuild.log
            target/tmp/xcuitest/*/root/out/*-xcresulttool.log
            target/tmp/xcuitest/*/root/out/*.xcresult
            target/tmp/xcuitest/*/root/out/*-attachments
          retention-days: 7
