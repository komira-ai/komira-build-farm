# The binaries nodes and servers run, built once per commit (docs/artifacts.md):
# kbf-daemon for darwin-arm64 (signed ad hoc with the hardened runtime), and kbf-daemon
# and kbf-server for linux-x86_64 and linux-arm64. Each comes as a tarball with a
# CycloneDX SBOM; one SHA256SUMS covers a commit's files.
#
# On a pull request or in the merge queue this is a build check: everything is built,
# signed, packaged and summed, and nothing is attested. On a push to main, the attest
# job signs build provenance for every file and an SBOM attestation for every tarball,
# then verifies them as a node's deployment job would. Only that job may hold
# `id-token: write` and `attestations: write`, and only under its exact main-push `if:`
# (the workflow lint, crates/kbf-it/tests/workflows, requires both).
#
# The files are kept as workflow artifacts for 90 days, GitHub's limit. Releases do not
# rely on them: a release attaches the exact bytes the farm ran, checked against these
# attestations, and never rebuilds.
name: artifacts

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

# A pull request's newer run replaces its older one. Every commit on main gets its own
# group, so no commit's run is cancelled or dropped while queued.
concurrency:
  group: artifacts-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # cargo-cyclonedx makes the SBOMs. Its release binaries, checked against their SHA-256
  # before use (the values the project publishes with them, recomputed when pinned).
  CYCLONEDX_VERSION: 0.5.9
  CYCLONEDX_SHA256_AARCH64_DARWIN: 4c53dfa21e70b65bf7f8d2592aadde3bcb02c1a40b6ec63b877e5ca65a29e180
  CYCLONEDX_SHA256_X86_64_LINUX: fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8
  CYCLONEDX_SHA256_AARCH64_LINUX: 7bf131ca5389b07a4f10c182bcf8a5ad339d64408b6f0d8f6834a0bd6120a06a

defaults:
  run:
    shell: bash

jobs:
  darwin-arm64:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET: aarch64-apple-darwin
      # The oldest macOS kbf-daemon supports: a property of the build, not of the runner.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Install cargo-cyclonedx (pinned version and checksum)
        run: |
          archive="$RUNNER_TEMP/cargo-cyclonedx.tar.xz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$archive" \
            "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-$CYCLONEDX_VERSION/cargo-cyclonedx-$TARGET.tar.xz"
          echo "$CYCLONEDX_SHA256_AARCH64_DARWIN  $archive" | shasum -a 256 --check
          tar -xJf "$archive" -C "$HOME/.cargo/bin" --strip-components=1 "cargo-cyclonedx-$TARGET/cargo-cyclonedx"
          cargo cyclonedx --version
      - run: sw_vers && uname -m && xcodebuild -version
      - run: cargo build --locked --release --target "$TARGET" -p kbf-node --bin kbf-daemon
      - name: Sign ad hoc with the hardened runtime, and check it
        run: bash tools/ci/sign-darwin.sh "target/$TARGET/release/kbf-daemon"
      - name: SBOM
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --describe binaries --target "$TARGET"
          git diff --exit-code -- Cargo.lock
      - name: Package
        run: |
          bash tools/ci/package-asset.sh "target/$TARGET/release/kbf-daemon" \
            crates/kbf-node/kbf-daemon_bin.cdx.json kbf-daemon darwin-arm64 dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-darwin-arm64
          path: dist/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # glibc: the binaries need the glibc of the runner image they were built on (Ubuntu
  # 24.04) or newer.
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Install cargo-cyclonedx (pinned version and checksum)
        run: |
          archive="$RUNNER_TEMP/cargo-cyclonedx.tar.xz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$archive" \
            "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-$CYCLONEDX_VERSION/cargo-cyclonedx-$TARGET.tar.xz"
          echo "$CYCLONEDX_SHA256_X86_64_LINUX  $archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$HOME/.cargo/bin" --strip-components=1 "cargo-cyclonedx-$TARGET/cargo-cyclonedx"
          cargo cyclonedx --version
      - run: cargo build --locked --release --target "$TARGET" -p kbf-node -p kbf-server --bins
      - name: SBOM
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --describe binaries --target "$TARGET"
          git diff --exit-code -- Cargo.lock
      - name: Package
        run: |
          bash tools/ci/package-asset.sh "target/$TARGET/release/kbf-daemon" \
            crates/kbf-node/kbf-daemon_bin.cdx.json kbf-daemon linux-x86_64 dist
          bash tools/ci/package-asset.sh "target/$TARGET/release/kbf-server" \
            crates/kbf-server/kbf-server_bin.cdx.json kbf-server linux-x86_64 dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-linux-x86_64
          path: dist/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Install cargo-cyclonedx (pinned version and checksum)
        run: |
          archive="$RUNNER_TEMP/cargo-cyclonedx.tar.xz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$archive" \
            "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-$CYCLONEDX_VERSION/cargo-cyclonedx-$TARGET.tar.xz"
          echo "$CYCLONEDX_SHA256_AARCH64_LINUX  $archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$HOME/.cargo/bin" --strip-components=1 "cargo-cyclonedx-$TARGET/cargo-cyclonedx"
          cargo cyclonedx --version
      - run: cargo build --locked --release --target "$TARGET" -p kbf-node -p kbf-server --bins
      - name: SBOM
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --describe binaries --target "$TARGET"
          git diff --exit-code -- Cargo.lock
      - name: Package
        run: |
          bash tools/ci/package-asset.sh "target/$TARGET/release/kbf-daemon" \
            crates/kbf-node/kbf-daemon_bin.cdx.json kbf-daemon linux-arm64 dist
          bash tools/ci/package-asset.sh "target/$TARGET/release/kbf-server" \
            crates/kbf-server/kbf-server_bin.cdx.json kbf-server linux-arm64 dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-linux-arm64
          path: dist/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # One SHA256SUMS over every platform's files, checked against the files (and against a
  # copy with a flipped byte, which must fail). Runs on every event.
  sums:
    needs: [darwin-arm64, linux-x86_64, linux-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-*
          path: dist
          merge-multiple: true
      - name: Assemble SHA256SUMS
        run: |
          mkdir "$RUNNER_TEMP/per-platform"
          mv dist/SHA256SUMS.* "$RUNNER_TEMP/per-platform/"
          sort -k2 "$RUNNER_TEMP"/per-platform/SHA256SUMS.* > dist/SHA256SUMS
          cat dist/SHA256SUMS | tee -a "$GITHUB_STEP_SUMMARY"
      - run: bash tools/ci/verify-assets.sh sums dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sha256sums
          path: dist/SHA256SUMS
          retention-days: 90
          if-no-files-found: error

  # Push to main only: build provenance for every file, an SBOM attestation for every
  # tarball, then the checks a node's deployment job makes (tools/ci/verify-assets.sh).
  attest:
    needs: [sums]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sha256sums
          path: dist
      - name: Check the files against SHA256SUMS before signing them
        run: |
          rm dist/SHA256SUMS.*
          bash tools/ci/verify-assets.sh sums dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/kbf-daemon-${{ github.sha }}-darwin-arm64.tar.gz
          sbom-path: dist/kbf-daemon-${{ github.sha }}-darwin-arm64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/kbf-daemon-${{ github.sha }}-linux-x86_64.tar.gz
          sbom-path: dist/kbf-daemon-${{ github.sha }}-linux-x86_64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/kbf-server-${{ github.sha }}-linux-x86_64.tar.gz
          sbom-path: dist/kbf-server-${{ github.sha }}-linux-x86_64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/kbf-daemon-${{ github.sha }}-linux-arm64.tar.gz
          sbom-path: dist/kbf-daemon-${{ github.sha }}-linux-arm64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/kbf-server-${{ github.sha }}-linux-arm64.tar.gz
          sbom-path: dist/kbf-server-${{ github.sha }}-linux-arm64.cdx.json
      - name: Verify as a node's deployment job does
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci/verify-assets.sh attestations dist
