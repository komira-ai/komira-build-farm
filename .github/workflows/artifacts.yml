# The binaries nodes and servers run, the deploy tool, and the installer that puts them on
# a host, built once per commit (docs/artifacts.md): kbf (all five modes, `kbf --version
# --json` says what it is), kbf-daemon, kbf-server, kbf-deploy and kbf-installer for
# linux-x86_64 and linux-arm64, and kbf, kbf-deploy, kbf-installer, kbf-host-install and
# kbf-updater for darwin-arm64 (each signed ad hoc with the hardened runtime; a Mac runs
# `kbf daemon`). Each comes as a
# tarball with a CycloneDX SBOM; one SHA256SUMS covers a commit's files. The kbf of each
# platform also comes with `kbf-<commit>-<platform>.version.json`, the exact bytes its
# `--version --json` printed on the runner that built it (only a runner of the platform can
# run its binary).
#
# A pull request runs none of it unless it carries the label `needs-artifacts` (add the
# label to get the files; every build and sums job carries the same condition, so an unlabelled
# pull request's run is skipped without queueing a runner). The merge queue is unchanged.
#
# On a pull request or in the merge queue this is a build check: everything is built,
# signed, packaged and summed, and nothing is attested. On a push to main this workflow is the
# second stage of the one pipeline (pipeline.yml calls it, `workflow_call`, after ci): the
# attest jobs sign build provenance for every file and an SBOM
# attestation for every tarball, per platform group (Linux does not wait for the macOS
# runners), and the verify jobs then check them, for the branch
# that was pushed, as the planned deployment job is to. In a called workflow `github.event_name`
# and `github.ref` are the caller's, so a call from the pipeline reads as the push it is. Only
# attest may hold `id-token:
# write` and `attestations: write`, and only under its exact `if:` (the workflow lint,
# crates/kbf-integration-test/tests/workflows, requires both; crates/kbf-integration-test/tests/release_artifacts
# pins the set of files built and attested). The pipeline grants the scopes to its call of this
# workflow and no other; the jobs here still ask for only their own.
#
# The files are kept as workflow artifacts for 90 days, GitHub's limit. The next stages of the
# pipeline read them from the same run (beta installs and tests the kbf of the linux-x86_64
# tarball), and the release (release.yml, started by the pipeline's success) attaches these
# exact files for a commit on main, checked again against these attestations as
# refs/heads/main's, and never rebuilds. The
# deployment job and the node's SHA-256 check are planned, not built
# (docs/design/mac-node-provisioning.md sections 4.1 and 4.2).
name: artifacts

on:
  pull_request:
    # `labeled`: adding `needs-artifacts` to an open pull request starts the build.
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  workflow_call:

permissions: {}

# A merge-queue run shares the one group `artifacts-merge-queue` and a RUNNING build is never
# cancelled (GitHub keeps one pending run per group). A pull request's label build is a build
# check, not the release pipeline: it has its own group per pull request, and a newer run of the
# same pull request replaces its older one. Called from the pipeline, the group is the run's
# own: what cancels a superseded push is the pipeline's group (pipeline.yml), so this one never
# holds up a newer push.
concurrency:
  group: artifacts-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || github.event_name == 'merge_group' && 'merge-queue' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # cargo-cyclonedx makes the SBOMs. Its release binaries, checked against their SHA-256
  # before use (the values the project publishes with them, recomputed when pinned).
  CYCLONEDX_VERSION: 0.5.9
  CYCLONEDX_SHA256_AARCH64_DARWIN: 4c53dfa21e70b65bf7f8d2592aadde3bcb02c1a40b6ec63b877e5ca65a29e180
  CYCLONEDX_SHA256_X86_64_LINUX: fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8
  CYCLONEDX_SHA256_AARCH64_LINUX: 7bf131ca5389b07a4f10c182bcf8a5ad339d64408b6f0d8f6834a0bd6120a06a
  # The kbf-installer and kbf packages of each job (the debs of a Linux job, the .pkg of the macOS one): nfpm builds the debs, and the
  # installer's trust directory holds a pinned gh. Both are release archives checked against their SHA-256 before use (the
  # values the projects publish with them, recomputed when pinned; the archive's, not the program's).
  GH_VERSION: 2.102.0
  GH_SHA256_X86_64_LINUX: bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386
  GH_SHA256_AARCH64_LINUX: 7862c86c72f43df3a2d93ddde6f473285b4e2af61b494849846827e513ef6484
  # The macOS arm64 zip of the same release, for the .pkg's trust directory.
  GH_SHA256_AARCH64_DARWIN: da922c20d1792e5b2cbf375593d7a658acf034c12c84e007e71c76ef959c337e
  NFPM_VERSION: 2.48.0
  NFPM_SHA256_X86_64_LINUX: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
  NFPM_SHA256_AARCH64_LINUX: a9a75213763783b7669719e505474c748c5ad7dc66591a195619deb50f85c2f4

defaults:
  run:
    shell: bash

jobs:
  darwin-arm64:
    # A pull request builds it only with the label `needs-artifacts`, like every job here:
    # nothing is attested from a pull request and the macOS runners are the scarce ones.
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'needs-artifacts') }}
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET: aarch64-apple-darwin
      # The oldest macOS the binaries support: a property of the build, not of the runner.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # The branch the package trusts, and is attested for; see linux-x86_64.
      PKG_SOURCE_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.base_ref) || github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the build counts the commits behind it for `seq`, and a
          # shallow clone counts none (0, "unknown").
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          # On a push (to main: the build the attest job signs)
          # nothing is restored: the attested binary is built from a clean target/,
          # never on a cached one. The lookup still tells the save step below whether
          # this key exists.
          lookup-only: ${{ github.event_name == 'push' }}
      - name: Install cargo-cyclonedx (pinned version and checksum)
        run: cargo xtask fetch --url "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-$CYCLONEDX_VERSION/cargo-cyclonedx-$TARGET.tar.xz" --sha256 "$CYCLONEDX_SHA256_AARCH64_DARWIN" --out "$HOME/.cargo/bin/cargo-cyclonedx" --extract tar.xz --member "cargo-cyclonedx-$TARGET/cargo-cyclonedx"
      - run: sw_vers
      - run: uname -m
      - run: xcodebuild -version
      - run: cargo cyclonedx --version
      # `kbf` is built by itself: built in one command with the installer, cargo builds the setup
      # library once for both, with the installer's `proxy` feature, and `kbf` would link the proxy
      # (crates/kbf-integration-test/tests/layering.rs checks the tree of `-p kbf-cli` alone).
      - run: cargo build --locked --release --target "$TARGET" -p kbf-cli --bin kbf
      - run: cargo build --locked --release --target "$TARGET" -p kbf-deploy -p kbf-installer -p kbf-host-install -p kbf-updater --bin kbf-deploy --bin kbf-installer --bin kbf-host-install --bin kbf-updater
      - name: Sign kbf ad hoc with the hardened runtime, and check it
        run: cargo xtask sign-darwin "target/$TARGET/release/kbf" --minos "$MACOSX_DEPLOYMENT_TARGET" --summary "$GITHUB_STEP_SUMMARY"
      - name: Sign kbf-deploy ad hoc with the hardened runtime, and check it
        run: cargo xtask sign-darwin "target/$TARGET/release/kbf-deploy" --minos "$MACOSX_DEPLOYMENT_TARGET" --summary "$GITHUB_STEP_SUMMARY"
      - name: Sign kbf-installer ad hoc with the hardened runtime, and check it
        run: cargo xtask sign-darwin "target/$TARGET/release/kbf-installer" --minos "$MACOSX_DEPLOYMENT_TARGET" --summary "$GITHUB_STEP_SUMMARY"
      - name: Sign kbf-host-install ad hoc with the hardened runtime, and check it
        run: cargo xtask sign-darwin "target/$TARGET/release/kbf-host-install" --minos "$MACOSX_DEPLOYMENT_TARGET" --summary "$GITHUB_STEP_SUMMARY"
      - name: Sign kbf-updater ad hoc with the hardened runtime, and check it
        run: cargo xtask sign-darwin "target/$TARGET/release/kbf-updater" --minos "$MACOSX_DEPLOYMENT_TARGET" --summary "$GITHUB_STEP_SUMMARY"
      - name: The signed kbf names the commit and a release build
        run: cargo xtask build-commit check --json "target/$TARGET/release/kbf" "$GITHUB_SHA"
      - name: The signed kbf-installer names the commit and a release build
        run: cargo xtask build-commit check --json "target/$TARGET/release/kbf-installer" "$GITHUB_SHA"
      # What the signed kbf says it is, kept as an asset: only this runner can run the darwin kbf.
      - name: Record what the signed kbf --version --json says
        run: cargo xtask release version-facts --binary "target/$TARGET/release/kbf" --commit "$GITHUB_SHA" --platform darwin-arm64 --out dist
      - name: SBOM
        run: cargo cyclonedx --format json --spec-version 1.5 --describe binaries --target "$TARGET"
      - name: The SBOM step left Cargo.lock unchanged
        run: git diff --exit-code -- Cargo.lock
      - name: Package kbf
        run: cargo xtask package --binary "target/$TARGET/release/kbf" --sbom crates/kbf-cli/kbf_bin.cdx.json --platform darwin-arm64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-deploy
        run: cargo xtask package --binary "target/$TARGET/release/kbf-deploy" --sbom crates/kbf-deploy/kbf-deploy_bin.cdx.json --platform darwin-arm64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-installer
        run: cargo xtask package --binary "target/$TARGET/release/kbf-installer" --sbom crates/kbf-installer/kbf-installer_bin.cdx.json --platform darwin-arm64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-host-install
        run: cargo xtask package --binary "target/$TARGET/release/kbf-host-install" --sbom crates/kbf-host-install/kbf-host-install_bin.cdx.json --platform darwin-arm64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-updater
        run: cargo xtask package --binary "target/$TARGET/release/kbf-updater" --sbom crates/kbf-updater/kbf-updater_bin.cdx.json --platform darwin-arm64 --commit "$GITHUB_SHA" --out dist
      - name: Check the packaged kbf's signature, and run it
        run: cargo xtask darwin-asset "dist/kbf-$GITHUB_SHA-darwin-arm64.tar.gz" kbf
      - name: Check the packaged kbf-deploy's signature, and run it
        run: cargo xtask darwin-asset "dist/kbf-deploy-$GITHUB_SHA-darwin-arm64.tar.gz" kbf-deploy
      - name: Check the packaged kbf-installer's signature, and run it
        run: cargo xtask darwin-asset "dist/kbf-installer-$GITHUB_SHA-darwin-arm64.tar.gz" kbf-installer
      - name: Check the packaged kbf-host-install's signature, and run it
        run: cargo xtask darwin-asset "dist/kbf-host-install-$GITHUB_SHA-darwin-arm64.tar.gz" kbf-host-install
      - name: Check the packaged kbf-updater's signature, and run it
        run: cargo xtask darwin-asset "dist/kbf-updater-$GITHUB_SHA-darwin-arm64.tar.gz" kbf-updater
      - name: The packaged kbf names the commit and a release build
        run: cargo xtask build-commit check-asset "dist/kbf-$GITHUB_SHA-darwin-arm64.tar.gz" "$GITHUB_SHA"
      - name: The packaged kbf-installer names the commit and a release build
        run: cargo xtask build-commit check-asset "dist/kbf-installer-$GITHUB_SHA-darwin-arm64.tar.gz" "$GITHUB_SHA"
      # The kbf-installer package (packaging/macos/README.md): the signed binary of this job, the
      # real LaunchDaemon property list, and a trust directory of the pinned gh, the Sigstore trusted
      # root and an installer.conf that trusts the branch this commit is attested on
      # (`PKG_SOURCE_REF`: the pushed branch on a push), at the paths the installer's macOS layout
      # reads. A Mac has what it needs to verify a release offline from this one file. Installer
      # installs it as root on this runner and every file, owner and mode is checked, and that no job
      # started; `pkg-macos-asset` then refuses it unless it holds the binary of the tarball checked
      # above and trusts that branch, and lists it in SHA256SUMS. The package is not signed (no
      # Developer ID): Gatekeeper does not open it by double click, and `installer -pkg` or MDM does.
      - name: Fetch the pinned gh, for the package's trust directory
        run: cargo xtask fetch --url "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_macOS_arm64.zip" --sha256 "$GH_SHA256_AARCH64_DARWIN" --out "$RUNNER_TEMP/tools/gh" --extract zip --member "gh_${GH_VERSION}_macOS_arm64/bin/gh"
      - name: Fetch the Sigstore trusted root with the pinned gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: $RUNNER_TEMP/tools/gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
      # A restored cache holds target/ as a whole (a path list cannot leave out a directory
      # inside one it names), so it may hold a previous run's package files; pkg-trust and
      # pkg-config refuse to overwrite a file.
      - name: Remove the package files a restored target/ may hold
        run: rm -rf target/pkg target/pkg-trust
      - name: Write the package's trust directory
        run: cargo xtask pkg-trust --gh "$RUNNER_TEMP/tools/gh" --trusted-root "$RUNNER_TEMP/trusted_root.jsonl" --source-ref "$PKG_SOURCE_REF" --out target/pkg-trust
      - name: Build the kbf-installer package
        run: cargo xtask pkg build --binary "target/$TARGET/release/kbf-installer" --launchd-plist packaging/macos/com.komira.kbf-installer.plist --trust target/pkg-trust/gh --trust target/pkg-trust/installer.conf --trust target/pkg-trust/trusted_root.jsonl --version-of "target/$TARGET/release/kbf-installer" --out target/pkg/out
      - name: Install the package as root, and check what it placed and that nothing started
        run: cargo xtask pkg-macos-install-test --package target/pkg/out --probe "/usr/local/kbf-installer/trust/gh --version::gh version $GH_VERSION" --probe "/usr/local/kbf-installer/bin/kbf-installer --version --json::${GITHUB_SHA:0:12}"
      - name: The package is the attested binary and trusts this branch, and is an asset
        run: cargo xtask pkg-macos-asset --package target/pkg/out --commit "$GITHUB_SHA" --binary-tarball "dist/kbf-installer-$GITHUB_SHA-darwin-arm64.tar.gz" --expect-ref "$PKG_SOURCE_REF" --gh "$RUNNER_TEMP/tools/gh" --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-darwin-arm64
          path: dist/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # glibc: the binaries need the glibc of the runner image they were built on (Ubuntu
  # 24.04) or newer.
  linux-x86_64:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'needs-artifacts') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET: x86_64-unknown-linux-gnu
      # The branch the package trusts, and is attested for: on a push the pushed branch; a pull
      # request is never attested and builds the package for the branch it is aimed at.
      PKG_SOURCE_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.base_ref) || github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the build counts the commits behind it for `seq`, and a
          # shallow clone counts none (0, "unknown").
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          # On a push (to main: the build the attest job signs)
          # nothing is restored: the attested binary is built from a clean target/,
          # never on a cached one. The lookup still tells the save step below whether
          # this key exists.
          lookup-only: ${{ github.event_name == 'push' }}
      - name: Install cargo-cyclonedx (pinned version and checksum)
        run: cargo xtask fetch --url "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-$CYCLONEDX_VERSION/cargo-cyclonedx-$TARGET.tar.xz" --sha256 "$CYCLONEDX_SHA256_X86_64_LINUX" --out "$HOME/.cargo/bin/cargo-cyclonedx" --extract tar.xz --member "cargo-cyclonedx-$TARGET/cargo-cyclonedx"
      - run: cargo cyclonedx --version
      # `kbf` is built without the installer (see the darwin job): its `kbf setup` links no proxy.
      - run: cargo build --locked --release --target "$TARGET" -p kbf-node -p kbf-server -p kbf-cli --bins
      - run: cargo build --locked --release --target "$TARGET" -p kbf-deploy -p kbf-installer -p kbf-host-install -p kbf-updater --bins
      - run: cargo xtask build-commit check "target/$TARGET/release/kbf-server" "$GITHUB_SHA"
      - name: kbf names the commit and a release build
        run: cargo xtask build-commit check --json "target/$TARGET/release/kbf" "$GITHUB_SHA"
      - name: kbf-installer names the commit and a release build
        run: cargo xtask build-commit check --json "target/$TARGET/release/kbf-installer" "$GITHUB_SHA"
      # What kbf says it is, kept as an asset (the darwin kbf cannot be run here, so every platform's job does).
      - name: Record what kbf --version --json says
        run: cargo xtask release version-facts --binary "target/$TARGET/release/kbf" --commit "$GITHUB_SHA" --platform linux-x86_64 --out dist
      - name: SBOM
        run: cargo cyclonedx --format json --spec-version 1.5 --describe binaries --target "$TARGET"
      - name: The SBOM step left Cargo.lock unchanged
        run: git diff --exit-code -- Cargo.lock
      - name: Package kbf-daemon
        run: cargo xtask package --binary "target/$TARGET/release/kbf-daemon" --sbom crates/kbf-node/kbf-daemon_bin.cdx.json --platform linux-x86_64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-server
        run: cargo xtask package --binary "target/$TARGET/release/kbf-server" --sbom crates/kbf-server/kbf-server_bin.cdx.json --platform linux-x86_64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-deploy
        run: cargo xtask package --binary "target/$TARGET/release/kbf-deploy" --sbom crates/kbf-deploy/kbf-deploy_bin.cdx.json --platform linux-x86_64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf
        run: cargo xtask package --binary "target/$TARGET/release/kbf" --sbom crates/kbf-cli/kbf_bin.cdx.json --platform linux-x86_64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-installer
        run: cargo xtask package --binary "target/$TARGET/release/kbf-installer" --sbom crates/kbf-installer/kbf-installer_bin.cdx.json --platform linux-x86_64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-host-install
        run: cargo xtask package --binary "target/$TARGET/release/kbf-host-install" --sbom crates/kbf-host-install/kbf-host-install_bin.cdx.json --platform linux-x86_64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-updater
        run: cargo xtask package --binary "target/$TARGET/release/kbf-updater" --sbom crates/kbf-updater/kbf-updater_bin.cdx.json --platform linux-x86_64 --commit "$GITHUB_SHA" --out dist
      - name: The packaged kbf names the commit and a release build
        run: cargo xtask build-commit check-asset "dist/kbf-$GITHUB_SHA-linux-x86_64.tar.gz" "$GITHUB_SHA"
      - name: The packaged kbf-installer names the commit and a release build
        run: cargo xtask build-commit check-asset "dist/kbf-installer-$GITHUB_SHA-linux-x86_64.tar.gz" "$GITHUB_SHA"
      # The kbf-installer package (packaging/linux/README.md): the real binary of this job, the
      # real units, and a trust directory of the pinned gh, the Sigstore trusted root and an
      # installer.conf that trusts the branch this commit is attested on (`PKG_SOURCE_REF`: the
      # pushed branch on a push). nfpm builds it twice and the bytes must match; a fresh Ubuntu
      # container installs, runs and removes it; `pkg-asset` then refuses it unless it holds the
      # binary of the tarball checked above and trusts that branch, and lists it in SHA256SUMS.
      # The kbf package is built from the same configuration step: this job's `kbf` at /usr/bin/kbf
      # and the units of the modes, depending on the kbf-installer package of the same version.
      # nfpm builds it twice too, and `pkg-kbf-asset` refuses it unless its kbf is the one of the
      # kbf tarball checked above, and lists it in SHA256SUMS.
      - name: Fetch the pinned gh, for the package's trust directory
        run: cargo xtask fetch --url "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz" --sha256 "$GH_SHA256_X86_64_LINUX" --out "$RUNNER_TEMP/tools/gh" --extract tar.gz --member "gh_${GH_VERSION}_linux_amd64/bin/gh"
      - name: Fetch nfpm (pinned version, checked by SHA-256)
        run: cargo xtask fetch --url "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" --sha256 "$NFPM_SHA256_X86_64_LINUX" --out "$RUNNER_TEMP/tools/nfpm" --extract tar.gz --member nfpm
      - name: Fetch the Sigstore trusted root with the pinned gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: $RUNNER_TEMP/tools/gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
      # A restored cache holds target/ as a whole (a path list cannot leave out a directory
      # inside one it names), so it may hold a previous run's package files; pkg-trust and
      # pkg-config refuse to overwrite a file.
      - name: Remove the package files a restored target/ may hold
        run: rm -rf target/pkg target/pkg-trust
      - name: Write the package's trust directory
        run: cargo xtask pkg-trust --gh "$RUNNER_TEMP/tools/gh" --trusted-root "$RUNNER_TEMP/trusted_root.jsonl" --source-ref "$PKG_SOURCE_REF" --out target/pkg-trust
      - name: Write the nfpm configuration
        run: cargo xtask pkg-config --binary "target/$TARGET/release/kbf-installer" --kbf "target/$TARGET/release/kbf" --units packaging/linux/units --trust target/pkg-trust --sysusers packaging/linux/sysusers.d/kbf-installer.conf --tmpfiles packaging/linux/tmpfiles.d/kbf-installer.conf --needrestart packaging/linux/needrestart/kbf.conf --platform linux-x86_64 --version-of "target/$TARGET/release/kbf-installer" --out target/pkg
      - name: Build the deb and the rpm of kbf-installer, each twice
        run: cargo xtask pkg-build --nfpm "$RUNNER_TEMP/tools/nfpm" --config target/pkg/nfpm.yaml --out target/pkg/out
      - name: Build the deb and the rpm of kbf, each twice
        run: cargo xtask pkg-build --nfpm "$RUNNER_TEMP/tools/nfpm" --config target/pkg/kbf/nfpm.yaml --out target/pkg/kbf-out
      - name: Install, run, remove and purge the deb in a fresh Ubuntu container
        run: cargo xtask pkg-install-test --package target/pkg/out --format deb --listing target/pkg/listing.txt --image-dir packaging/linux/test/ubuntu --probe "/usr/share/kbf-installer/trust/gh --version::gh version $GH_VERSION" --probe "kbf-installer --version --json::${GITHUB_SHA:0:12}"
      - name: The deb is the attested binary and trusts this branch, and is an asset
        run: cargo xtask pkg-asset --package target/pkg/out --platform linux-x86_64 --commit "$GITHUB_SHA" --binary-tarball "dist/kbf-installer-$GITHUB_SHA-linux-x86_64.tar.gz" --expect-ref "$PKG_SOURCE_REF" --gh "$RUNNER_TEMP/tools/gh" --out dist
      - name: The kbf deb is the attested kbf with the units of the modes, and is an asset
        run: cargo xtask pkg-kbf-asset --package target/pkg/kbf-out --platform linux-x86_64 --commit "$GITHUB_SHA" --kbf-tarball "dist/kbf-$GITHUB_SHA-linux-x86_64.tar.gz" --out dist
      # The frontend image (packaging/container/frontend/Dockerfile): the attested kbf, unpacked from
      # the tarball above and not rebuilt, on a pinned base. It is built twice from the commit's time
      # (SOURCE_DATE_EPOCH, no provenance or SBOM attachments of buildx's own) and the two
      # tarballs must be the same bytes; `pkg-image-asset` then refuses it unless its kbf is the
      # tarball's, it runs `kbf --mode=frontend` as a user that is not root and it is for this platform.
      - name: The commit's time, for the frontend image
        run: cargo xtask source-date-epoch --commit "$GITHUB_SHA" --output "$GITHUB_ENV"
      - name: The frontend image directories
        run: mkdir -p target/image target/image-out
      - name: The frontend image context holds the attested kbf
        run: tar -xzf "dist/kbf-$GITHUB_SHA-linux-x86_64.tar.gz" -C target/image kbf
      - name: A BuildKit builder, pinned by digest
        run: docker buildx create --name kbf-image --driver docker-container --driver-opt image=moby/buildkit:v0.23.2@sha256:ddd1ca44b21eda906e81ab14a3d467fa6c39cd73b9a39df1196210edcb8db59e --use
      - name: Build the frontend image, build 1 of 2
        run: docker buildx build --builder kbf-image --no-cache --platform linux/amd64 --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH --tag "kbf-frontend:$GITHUB_SHA" --file packaging/container/frontend/Dockerfile --output "type=oci,dest=target/image-out/1.oci.tar,rewrite-timestamp=true" target/image
      - name: Build the frontend image, build 2 of 2
        run: docker buildx build --builder kbf-image --no-cache --platform linux/amd64 --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH --tag "kbf-frontend:$GITHUB_SHA" --file packaging/container/frontend/Dockerfile --output "type=oci,dest=target/image-out/2.oci.tar,rewrite-timestamp=true" target/image
      - name: The two builds of the frontend image are the same bytes
        run: cmp target/image-out/1.oci.tar target/image-out/2.oci.tar
      - name: The frontend image is the attested kbf, and is an asset
        run: cargo xtask pkg-image-asset --image target/image-out/1.oci.tar --platform linux-x86_64 --commit "$GITHUB_SHA" --kbf-tarball "dist/kbf-$GITHUB_SHA-linux-x86_64.tar.gz" --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-linux-x86_64
          path: dist/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  linux-arm64:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'needs-artifacts') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET: aarch64-unknown-linux-gnu
      # The branch the package trusts, and is attested for: on a push the pushed branch; a pull
      # request is never attested and builds the package for the branch it is aimed at.
      PKG_SOURCE_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.base_ref) || github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the build counts the commits behind it for `seq`, and a
          # shallow clone counts none (0, "unknown").
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          # On a push (to main: the build the attest job signs)
          # nothing is restored: the attested binary is built from a clean target/,
          # never on a cached one. The lookup still tells the save step below whether
          # this key exists.
          lookup-only: ${{ github.event_name == 'push' }}
      - name: Install cargo-cyclonedx (pinned version and checksum)
        run: cargo xtask fetch --url "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-$CYCLONEDX_VERSION/cargo-cyclonedx-$TARGET.tar.xz" --sha256 "$CYCLONEDX_SHA256_AARCH64_LINUX" --out "$HOME/.cargo/bin/cargo-cyclonedx" --extract tar.xz --member "cargo-cyclonedx-$TARGET/cargo-cyclonedx"
      - run: cargo cyclonedx --version
      # `kbf` is built without the installer (see the darwin job): its `kbf setup` links no proxy.
      - run: cargo build --locked --release --target "$TARGET" -p kbf-node -p kbf-server -p kbf-cli --bins
      - run: cargo build --locked --release --target "$TARGET" -p kbf-deploy -p kbf-installer -p kbf-host-install -p kbf-updater --bins
      - run: cargo xtask build-commit check "target/$TARGET/release/kbf-server" "$GITHUB_SHA"
      - name: kbf names the commit and a release build
        run: cargo xtask build-commit check --json "target/$TARGET/release/kbf" "$GITHUB_SHA"
      - name: kbf-installer names the commit and a release build
        run: cargo xtask build-commit check --json "target/$TARGET/release/kbf-installer" "$GITHUB_SHA"
      # What kbf says it is, kept as an asset (see linux-x86_64).
      - name: Record what kbf --version --json says
        run: cargo xtask release version-facts --binary "target/$TARGET/release/kbf" --commit "$GITHUB_SHA" --platform linux-arm64 --out dist
      - name: SBOM
        run: cargo cyclonedx --format json --spec-version 1.5 --describe binaries --target "$TARGET"
      - name: The SBOM step left Cargo.lock unchanged
        run: git diff --exit-code -- Cargo.lock
      - name: Package kbf-daemon
        run: cargo xtask package --binary "target/$TARGET/release/kbf-daemon" --sbom crates/kbf-node/kbf-daemon_bin.cdx.json --platform linux-arm64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-server
        run: cargo xtask package --binary "target/$TARGET/release/kbf-server" --sbom crates/kbf-server/kbf-server_bin.cdx.json --platform linux-arm64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-deploy
        run: cargo xtask package --binary "target/$TARGET/release/kbf-deploy" --sbom crates/kbf-deploy/kbf-deploy_bin.cdx.json --platform linux-arm64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf
        run: cargo xtask package --binary "target/$TARGET/release/kbf" --sbom crates/kbf-cli/kbf_bin.cdx.json --platform linux-arm64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-installer
        run: cargo xtask package --binary "target/$TARGET/release/kbf-installer" --sbom crates/kbf-installer/kbf-installer_bin.cdx.json --platform linux-arm64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-host-install
        run: cargo xtask package --binary "target/$TARGET/release/kbf-host-install" --sbom crates/kbf-host-install/kbf-host-install_bin.cdx.json --platform linux-arm64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-updater
        run: cargo xtask package --binary "target/$TARGET/release/kbf-updater" --sbom crates/kbf-updater/kbf-updater_bin.cdx.json --platform linux-arm64 --commit "$GITHUB_SHA" --out dist
      - name: The packaged kbf names the commit and a release build
        run: cargo xtask build-commit check-asset "dist/kbf-$GITHUB_SHA-linux-arm64.tar.gz" "$GITHUB_SHA"
      - name: The packaged kbf-installer names the commit and a release build
        run: cargo xtask build-commit check-asset "dist/kbf-installer-$GITHUB_SHA-linux-arm64.tar.gz" "$GITHUB_SHA"
      # The kbf-installer package (packaging/linux/README.md): the real binary of this job, the
      # real units, and a trust directory of the pinned gh, the Sigstore trusted root and an
      # installer.conf that trusts the branch this commit is attested on (`PKG_SOURCE_REF`: the
      # pushed branch on a push). nfpm builds it twice and the bytes must match; a fresh Ubuntu
      # container installs, runs and removes it; `pkg-asset` then refuses it unless it holds the
      # binary of the tarball checked above and trusts that branch, and lists it in SHA256SUMS.
      # The kbf package is built and made an asset beside it (see linux-x86_64).
      - name: Fetch the pinned gh, for the package's trust directory
        run: cargo xtask fetch --url "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_arm64.tar.gz" --sha256 "$GH_SHA256_AARCH64_LINUX" --out "$RUNNER_TEMP/tools/gh" --extract tar.gz --member "gh_${GH_VERSION}_linux_arm64/bin/gh"
      - name: Fetch nfpm (pinned version, checked by SHA-256)
        run: cargo xtask fetch --url "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_arm64.tar.gz" --sha256 "$NFPM_SHA256_AARCH64_LINUX" --out "$RUNNER_TEMP/tools/nfpm" --extract tar.gz --member nfpm
      - name: Fetch the Sigstore trusted root with the pinned gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: $RUNNER_TEMP/tools/gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
      # A restored cache holds target/ as a whole (a path list cannot leave out a directory
      # inside one it names), so it may hold a previous run's package files; pkg-trust and
      # pkg-config refuse to overwrite a file.
      - name: Remove the package files a restored target/ may hold
        run: rm -rf target/pkg target/pkg-trust
      - name: Write the package's trust directory
        run: cargo xtask pkg-trust --gh "$RUNNER_TEMP/tools/gh" --trusted-root "$RUNNER_TEMP/trusted_root.jsonl" --source-ref "$PKG_SOURCE_REF" --out target/pkg-trust
      - name: Write the nfpm configuration
        run: cargo xtask pkg-config --binary "target/$TARGET/release/kbf-installer" --kbf "target/$TARGET/release/kbf" --units packaging/linux/units --trust target/pkg-trust --sysusers packaging/linux/sysusers.d/kbf-installer.conf --tmpfiles packaging/linux/tmpfiles.d/kbf-installer.conf --needrestart packaging/linux/needrestart/kbf.conf --platform linux-arm64 --version-of "target/$TARGET/release/kbf-installer" --out target/pkg
      - name: Build the deb and the rpm of kbf-installer, each twice
        run: cargo xtask pkg-build --nfpm "$RUNNER_TEMP/tools/nfpm" --config target/pkg/nfpm.yaml --out target/pkg/out
      - name: Build the deb and the rpm of kbf, each twice
        run: cargo xtask pkg-build --nfpm "$RUNNER_TEMP/tools/nfpm" --config target/pkg/kbf/nfpm.yaml --out target/pkg/kbf-out
      - name: Install, run, remove and purge the deb in a fresh Ubuntu container
        run: cargo xtask pkg-install-test --package target/pkg/out --format deb --listing target/pkg/listing.txt --image-dir packaging/linux/test/ubuntu --probe "/usr/share/kbf-installer/trust/gh --version::gh version $GH_VERSION" --probe "kbf-installer --version --json::${GITHUB_SHA:0:12}"
      - name: The deb is the attested binary and trusts this branch, and is an asset
        run: cargo xtask pkg-asset --package target/pkg/out --platform linux-arm64 --commit "$GITHUB_SHA" --binary-tarball "dist/kbf-installer-$GITHUB_SHA-linux-arm64.tar.gz" --expect-ref "$PKG_SOURCE_REF" --gh "$RUNNER_TEMP/tools/gh" --out dist
      - name: The kbf deb is the attested kbf with the units of the modes, and is an asset
        run: cargo xtask pkg-kbf-asset --package target/pkg/kbf-out --platform linux-arm64 --commit "$GITHUB_SHA" --kbf-tarball "dist/kbf-$GITHUB_SHA-linux-arm64.tar.gz" --out dist
      # The frontend image (packaging/container/frontend/Dockerfile): the attested kbf, unpacked from
      # the tarball above and not rebuilt, on a pinned base. It is built twice from the commit's time
      # (SOURCE_DATE_EPOCH, no provenance or SBOM attachments of buildx's own) and the two
      # tarballs must be the same bytes; `pkg-image-asset` then refuses it unless its kbf is the
      # tarball's, it runs `kbf --mode=frontend` as a user that is not root and it is for this platform.
      - name: The commit's time, for the frontend image
        run: cargo xtask source-date-epoch --commit "$GITHUB_SHA" --output "$GITHUB_ENV"
      - name: The frontend image directories
        run: mkdir -p target/image target/image-out
      - name: The frontend image context holds the attested kbf
        run: tar -xzf "dist/kbf-$GITHUB_SHA-linux-arm64.tar.gz" -C target/image kbf
      - name: A BuildKit builder, pinned by digest
        run: docker buildx create --name kbf-image --driver docker-container --driver-opt image=moby/buildkit:v0.23.2@sha256:ddd1ca44b21eda906e81ab14a3d467fa6c39cd73b9a39df1196210edcb8db59e --use
      - name: Build the frontend image, build 1 of 2
        run: docker buildx build --builder kbf-image --no-cache --platform linux/arm64 --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH --tag "kbf-frontend:$GITHUB_SHA" --file packaging/container/frontend/Dockerfile --output "type=oci,dest=target/image-out/1.oci.tar,rewrite-timestamp=true" target/image
      - name: Build the frontend image, build 2 of 2
        run: docker buildx build --builder kbf-image --no-cache --platform linux/arm64 --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH --tag "kbf-frontend:$GITHUB_SHA" --file packaging/container/frontend/Dockerfile --output "type=oci,dest=target/image-out/2.oci.tar,rewrite-timestamp=true" target/image
      - name: The two builds of the frontend image are the same bytes
        run: cmp target/image-out/1.oci.tar target/image-out/2.oci.tar
      - name: The frontend image is the attested kbf, and is an asset
        run: cargo xtask pkg-image-asset --image target/image-out/1.oci.tar --platform linux-arm64 --commit "$GITHUB_SHA" --kbf-tarball "dist/kbf-$GITHUB_SHA-linux-arm64.tar.gz" --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-linux-arm64
          path: dist/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Attestation is per platform group, so the Linux files are attested and verifiable as
  # soon as the Linux jobs finish, however long the macOS runner queue is: Linux is
  # sums-linux -> attest-linux -> verify-linux, macOS is sums-darwin-arm64 ->
  # attest-darwin-arm64 -> verify-darwin-arm64. Each group has its own SHA256SUMS (artifact
  # sha256sums-linux, sha256sums-darwin-arm64) over just its files; the subjects of every
  # file's attestations are the same as in the one SHA256SUMS.

  # SHA256SUMS over the Linux files (both architectures), as `sums` is over all.
  sums-linux:
    needs: [linux-x86_64, linux-arm64]
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'needs-artifacts') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-linux-*
          path: dist
          merge-multiple: true
      - run: rustup toolchain install
      - name: Assemble SHA256SUMS
        run: cargo xtask sums assemble dist --summary "$GITHUB_STEP_SUMMARY"
      - run: cargo xtask verify-assets sums dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sha256sums-linux
          path: dist/SHA256SUMS
          retention-days: 90
          if-no-files-found: error

  # SHA256SUMS over the macOS files.
  sums-darwin-arm64:
    needs: [darwin-arm64]
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'needs-artifacts') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-darwin-arm64
          path: dist
          merge-multiple: true
      - run: rustup toolchain install
      - name: Assemble SHA256SUMS
        run: cargo xtask sums assemble dist --summary "$GITHUB_STEP_SUMMARY"
      - run: cargo xtask verify-assets sums dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sha256sums-darwin-arm64
          path: dist/SHA256SUMS
          retention-days: 90
          if-no-files-found: error

  # One SHA256SUMS over every platform's files (the commit's whole set, the file a release
  # carries), checked against the files and a flipped copy. Runs on every event, a pull request
  # without the label excepted, once every platform is built. Nothing waits for it: attestation is per platform, below.
  sums:
    needs: [darwin-arm64, linux-x86_64, linux-arm64]
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'needs-artifacts') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-*
          path: dist
          merge-multiple: true
      - run: rustup toolchain install
      - name: Assemble SHA256SUMS
        run: cargo xtask sums assemble dist --summary "$GITHUB_STEP_SUMMARY"
      - run: cargo xtask verify-assets sums dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sha256sums
          path: dist/SHA256SUMS
          retention-days: 90
          if-no-files-found: error

  # Push to main only: build provenance for every Linux file, an SBOM
  # attestation for every Linux tarball, and a provenance attestation (and its bundle) of each
  # tarball alone. This job signs and does nothing else: while it holds `id-token: write` no
  # repository code runs, and nothing is built, only the pinned actions below and a `cp` that
  # names each bundle. The Linux sums job checked these files against its SHA256SUMS; the Linux
  # verify job checks what it signs.
  attest-linux:
    needs: [sums-linux]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-linux-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sha256sums-linux
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/kbf-daemon-${{ github.sha }}-linux-x86_64.tar.gz
          sbom-path: dist/kbf-daemon-${{ github.sha }}-linux-x86_64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/kbf-server-${{ github.sha }}-linux-x86_64.tar.gz
          sbom-path: dist/kbf-server-${{ github.sha }}-linux-x86_64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/kbf-deploy-${{ github.sha }}-linux-x86_64.tar.gz
          sbom-path: dist/kbf-deploy-${{ github.sha }}-linux-x86_64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/kbf-${{ github.sha }}-linux-x86_64.tar.gz
          sbom-path: dist/kbf-${{ github.sha }}-linux-x86_64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/kbf-installer-${{ github.sha }}-linux-x86_64.tar.gz
          sbom-path: dist/kbf-installer-${{ github.sha }}-linux-x86_64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/kbf-host-install-${{ github.sha }}-linux-x86_64.tar.gz
