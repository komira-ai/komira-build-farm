# CI for pull requests, the merge queue and main. GitHub-hosted runners only; the repository lints in
# crates/kbf-it/tests/repo_lints.rs hold every workflow to that, to commit-SHA pinned
# actions from the set the repository's Actions policy allows (actions/* and
# tailscale/github-action), and to a top-level `permissions: {}`.
#
# The Cargo cache (registry, git checkouts and target) is keyed on the runner, the job,
# Cargo.lock and rust-toolchain.toml. Every job restores it; only a push to main saves
# it, and only when the exact key missed, so a pull request never writes the cache.
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Incremental artifacts only bloat a cached target directory (rust-cache set this too).
  CARGO_INCREMENTAL: 0

jobs:
  # MUTANT, do not merge: the PR #173 mutants, each against the three crates' tests.
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-test-x86-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-test-x86-
      - run: cargo test --locked --no-fail-fast -p kbf-driver-native -p kbf-node -p kbf-server
      - run: python3 tools/ci/mut173.py cargo test --locked --no-fail-fast -p kbf-driver-native -p kbf-node -p kbf-server
