# CI for pull requests, the merge queue and main. GitHub-hosted runners only; the repository lints in
# crates/kbf-it/tests/repo_lints.rs hold every workflow to that, to commit-SHA pinned
# actions from the set the repository's Actions policy allows (actions/* and
# tailscale/github-action), and to a top-level `permissions: {}`.
#
# The Cargo cache (registry, git checkouts and target) is keyed on the runner, the job,
# Cargo.lock and rust-toolchain.toml. Every job restores it; only a push to main saves
# it, and only when the exact key missed, so a pull request never writes the cache.
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Incremental artifacts only bloat a cached target directory (rust-cache set this too).
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  lints:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo test -p kbf-it --locked --test repo_lints
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Licences, advisories, bans and sources, as deny.toml configures them. cargo-deny is
  # the release binary, checked against its SHA-256 before use.
  deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DENY_VERSION: 0.20.2
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Install cargo-deny (pinned version and checksum)
        run: |
          archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$DENY_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$HOME/.cargo/bin" --strip-components=1 \
            "cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl/cargo-deny"
          cargo deny --version
      # The arguments cargo-deny-action passed by default.
      - run: cargo deny --log-level warn --manifest-path ./Cargo.toml --all-features check

  test-x86:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo test --workspace --locked
      # kbf-server's --version names this commit, and the CI-only override stamps two
      # other commits from the same checkout (crates/kbf-server/build.rs).
      - run: bash tools/ci/check-build-commit.sh stamps "$GITHUB_SHA"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The ObjectStore conformance suite against real S3 stores in service containers, each
  # pinned by digest: MinIO (the bridge store) and RustFS (its replacement). Each store
  # runs the suite twice: a plain bucket, and a bucket with Object Lock. The key pair is
  # a throwaway for these containers, which live only for this job.
  objstore-s3:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      minio:
        # Chainguard's build of upstream MinIO: minio/minio is gone from Docker Hub and
        # quay.io/minio/minio no longer serves anonymous pulls. Pinned to the digest of
        # its `latest` image index.
        image: cgr.dev/chainguard/minio@sha256:e7ca559d9f7c0b5f24f5f669bb92f40f3ca88d56273b808bf3a7c116c17d2ffa
        command: server /data
        env:
          MINIO_ROOT_USER: kbf-ci-access
          MINIO_ROOT_PASSWORD: kbf-ci-throwaway
        ports:
          - 9000:9000
      rustfs:
        # rustfs/rustfs:1.0.1, image index digest.
        image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        env:
          RUSTFS_ACCESS_KEY: kbf-ci-access
          RUSTFS_SECRET_KEY: kbf-ci-throwaway
        ports:
          - 9100:9000
    env:
      AWS_ACCESS_KEY_ID: kbf-ci-access
      AWS_SECRET_ACCESS_KEY: kbf-ci-throwaway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo build -p kbf-objstore --example s3_conformance --locked
      - name: Wait for both stores to accept connections
        run: |
          for port in 9000 9100; do
            for _ in $(seq 60); do
              curl -s -o /dev/null "http://127.0.0.1:$port/" && break
              sleep 1
            done
          done
      - name: MinIO, plain bucket
        run: cargo run -p kbf-objstore --example s3_conformance --locked -- --endpoint http://127.0.0.1:9000 --bucket kbf-conformance --create-bucket --conditional-put
      - name: MinIO, Object Lock bucket
        run: cargo run -p kbf-objstore --example s3_conformance --locked -- --endpoint http://127.0.0.1:9000 --bucket kbf-conformance-lock --create-bucket --conditional-put --object-lock
      - name: RustFS, plain bucket
        if: ${{ !cancelled() }}
        run: cargo run -p kbf-objstore --example s3_conformance --locked -- --endpoint http://127.0.0.1:9100 --bucket kbf-conformance --create-bucket --conditional-put
      - name: RustFS, Object Lock bucket
        if: ${{ !cancelled() }}
        run: cargo run -p kbf-objstore --example s3_conformance --locked -- --endpoint http://127.0.0.1:9100 --bucket kbf-conformance-lock --create-bucket --conditional-put --object-lock
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Line and branch coverage per crate, and the ratchet in `coverage-baseline`
  # (crates/kbf-coverage). Branch coverage (`--branch`, rustc's
  # `-Zcoverage-options=branch`) is unstable, so this job alone builds with a pinned
  # nightly; every other job stays on the toolchain in rust-toolchain.toml. The nightly
  # may warn where stable does not, so `-D warnings` is off here (clippy enforces it).
  # cargo-llvm-cov is the release binary, checked against its SHA-256 before use.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTFLAGS: ""
      COVERAGE_TOOLCHAIN: nightly-2026-10-01
      LLVM_COV_VERSION: 0.9.1
      LLVM_COV_SHA256: b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$COVERAGE_TOOLCHAIN" --profile minimal --component llvm-tools-preview
      - name: Install cargo-llvm-cov (pinned version and checksum)
        run: |
          archive="$RUNNER_TEMP/cargo-llvm-cov.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$archive" \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v$LLVM_COV_VERSION/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
          echo "$LLVM_COV_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$HOME/.cargo/bin" cargo-llvm-cov
          cargo "+$COVERAGE_TOOLCHAIN" llvm-cov --version
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      # `-skip-functions` leaves the per-function records (FN, FNDA) out of the lcov
      # export. With branch coverage on, llvm-cov's lcov exporter segfaults while
      # writing them for kbf-front's async service methods (LLVM 23.1 in this nightly;
      # it looks like LLVM issue 220574). Lines and branches, all the ratchet reads, are
      # unaffected: their totals match llvm-cov's own text report.
      - name: Run the workspace tests under coverage
        env:
          LLVM_COV_FLAGS: -skip-functions
        run: |
          mkdir -p target/coverage
          cargo "+$COVERAGE_TOOLCHAIN" llvm-cov --workspace --locked --branch \
            --lcov --output-path target/coverage/lcov.info
      # `shell: bash` sets pipefail, so the ratchet's exit status survives the tee.
      - name: Per-crate table and ratchet
        shell: bash
        run: |
          cargo "+$COVERAGE_TOOLCHAIN" run -p kbf-coverage --locked -- \
            --lcov target/coverage/lcov.info --root "$GITHUB_WORKSPACE" \
            --baseline coverage-baseline \
            --write-baseline target/coverage/coverage-baseline.measured \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            target/coverage/lcov.info
            target/coverage/coverage-baseline.measured
          if-no-files-found: error
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # A second job rather than a matrix: the workflow lint requires a literal hosted label
  # in runs-on, so the runner a job lands on is readable from this file alone.
  test-arm:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo test --workspace --locked
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The native driver on a real Mac (Apple silicon). The process-tree kill, memory
  # kill, output, cleanup and network tests run against libproc and sandbox-exec
  # here (the Linux jobs run the same tests against /proc, where the network is not
  # enforced); the daemon binary is built and started with each driver, which
  # detects the node through sysctl.
  native-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: sw_vers && uname -m && sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
      - run: cargo build -p kbf-node --bin kbf-daemon --locked
      - run: cargo test -p kbf-outputs -p kbf-driver-native -p kbf-node --locked
      # The daemon's unit tests, which read its suspend-counting clock on macOS
      # (CLOCK_MONOTONIC_RAW), and the fence across a suspend (issue #78).
      - run: cargo test -p kbf-daemon --lib --test suspend --locked
      # The root helper for per-lease users: its unit tests, then the helper itself run
      # as root (passwordless sudo) with real users, launchd, the sweep and the caller
      # check by code signature (docs/design/fleet-updates-security.md S4.2, S4.3).
      - run: cargo test -p kbf-mac-session --locked
      - run: bash tools/ci/mac-session-tests.sh
      # kbf-mac-provision on this VM, as root, running the daemon built above: what a
      # hosted VM can prove (the script's header lists what it applies, asserts and
      # only reads). Last, because it changes this runner's settings.
      - run: sudo sh tools/mac-provision/test/hosted-macos.sh target/debug/kbf-daemon
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # kbf-mac-provision (tools/mac-provision) against a fake Mac: shellcheck, the test
  # suite under dash, its line and branch coverage (100%, from bash's trace), and the
  # planted mutants, each of which must turn its tests red. native-macos runs the same
  # script on a real macOS VM.
  mac-provision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck --version && shellcheck -S warning -s sh tools/mac-provision/kbf-mac-provision tools/mac-provision/test/fakecmd tools/mac-provision/test/*.sh
      - run: sh tools/mac-provision/test/run.sh
      - run: sh tools/mac-provision/test/coverage.sh
      - run: sh tools/mac-provision/test/mutants.sh

  # The container driver against real rootless Podman, inside a Delegate=yes system
  # unit (tools/ci/podman-tests.sh; the T4 spike found both arches carry it). The same
  # tests show as ignored, with their reason, in the plain test jobs above.
  podman-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: bash tools/ci/podman-tests.sh
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  podman-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: bash tools/ci/podman-tests.sh
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
