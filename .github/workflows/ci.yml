# CI for pull requests, the merge queue and main. GitHub-hosted runners only; the repository lints in
# crates/kbf-it/tests/repo_lints.rs hold every workflow to that, to commit-SHA pinned
# actions and to a top-level `permissions: {}`.
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  lints:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p kbf-it --locked --test repo_lints

  # Licences, advisories, bans and sources, as deny.toml configures them.
  deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  test-x86:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked

  # The ObjectStore conformance suite against real S3 stores in service containers, each
  # pinned by digest: MinIO (the bridge store) and RustFS (its replacement). Each store
  # runs the suite twice: a plain bucket, and a bucket with Object Lock. The key pair is
  # a throwaway for these containers, which live only for this job.
  objstore-s3:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      minio:
        # Chainguard's build of upstream MinIO: minio/minio is gone from Docker Hub and
        # quay.io/minio/minio no longer serves anonymous pulls. Pinned to the digest of
        # its `latest` image index.
        image: cgr.dev/chainguard/minio@sha256:e7ca559d9f7c0b5f24f5f669bb92f40f3ca88d56273b808bf3a7c116c17d2ffa
        command: server /data
        env:
          MINIO_ROOT_USER: kbf-ci-access
          MINIO_ROOT_PASSWORD: kbf-ci-throwaway
        ports:
          - 9000:9000
      rustfs:
        # rustfs/rustfs:1.0.1, image index digest.
        image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        env:
          RUSTFS_ACCESS_KEY: kbf-ci-access
          RUSTFS_SECRET_KEY: kbf-ci-throwaway
        ports:
          - 9100:9000
    env:
      AWS_ACCESS_KEY_ID: kbf-ci-access
      AWS_SECRET_ACCESS_KEY: kbf-ci-throwaway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p kbf-objstore --example s3_conformance --locked
      - name: Wait for both stores to accept connections
        run: |
          for port in 9000 9100; do
            for _ in $(seq 60); do
              curl -s -o /dev/null "http://127.0.0.1:$port/" && break
              sleep 1
            done
          done
      - name: MinIO, plain bucket
        run: cargo run -p kbf-objstore --example s3_conformance --locked -- --endpoint http://127.0.0.1:9000 --bucket kbf-conformance --create-bucket --conditional-put
      - name: MinIO, Object Lock bucket
        run: cargo run -p kbf-objstore --example s3_conformance --locked -- --endpoint http://127.0.0.1:9000 --bucket kbf-conformance-lock --create-bucket --conditional-put --object-lock
      - name: RustFS, plain bucket
        if: ${{ !cancelled() }}
        run: cargo run -p kbf-objstore --example s3_conformance --locked -- --endpoint http://127.0.0.1:9100 --bucket kbf-conformance --create-bucket --conditional-put
      - name: RustFS, Object Lock bucket
        if: ${{ !cancelled() }}
        run: cargo run -p kbf-objstore --example s3_conformance --locked -- --endpoint http://127.0.0.1:9100 --bucket kbf-conformance-lock --create-bucket --conditional-put --object-lock

  # Line and branch coverage per crate, and the ratchet in `coverage-baseline`
  # (crates/kbf-coverage). Branch coverage (`--branch`, rustc's
  # `-Zcoverage-options=branch`) is unstable, so this job alone builds with a pinned
  # nightly; every other job stays on the toolchain in rust-toolchain.toml. The nightly
  # may warn where stable does not, so `-D warnings` is off here (clippy enforces it).
  # cargo-llvm-cov is the release binary, checked against its SHA-256 before use.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTFLAGS: ""
      COVERAGE_TOOLCHAIN: nightly-2026-10-01
      LLVM_COV_VERSION: 0.9.1
      LLVM_COV_SHA256: b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$COVERAGE_TOOLCHAIN" --profile minimal --component llvm-tools-preview
      - name: Install cargo-llvm-cov (pinned version and checksum)
        run: |
          archive="$RUNNER_TEMP/cargo-llvm-cov.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$archive" \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v$LLVM_COV_VERSION/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
          echo "$LLVM_COV_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$HOME/.cargo/bin" cargo-llvm-cov
          cargo "+$COVERAGE_TOOLCHAIN" llvm-cov --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run the workspace tests under coverage
        run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov --workspace --locked --branch --no-report
      - name: Diagnose export variants
        shell: bash
        run: |
          set +e; mkdir -p target/coverage
          v() { name=$1; shift; echo "::group::variant $name"; "$@" > "target/coverage/$name.out" 2> "target/coverage/$name.err"; rc=$?; tail -c 600 "target/coverage/$name.err"; echo "::endgroup::"; echo "VARIANT $name rc=$rc bytes=$(wc -c < target/coverage/$name.out)"; }
          C="cargo +$COVERAGE_TOOLCHAIN llvm-cov report"
          v default-1 $C --lcov
          v default-2 $C --lcov
          LLVM_COV_FLAGS=-num-threads=1 v threads1 $C --lcov
          v json-summary $C --json --summary-only
          v text $C
          v no-front $C --lcov --ignore-filename-regex 'crates/kbf-front/'
          v only-coverage $C --lcov -p kbf-coverage
          v only-front $C --lcov -p kbf-front
          LLVM_COV_FLAGS=-num-threads=1 v threads1-again $C --lcov
          cp target/coverage/threads1.out target/coverage/lcov.info || true
          grep VARIANT -r /dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            target/coverage/
          if-no-files-found: warn

  # A second job rather than a matrix: the workflow lint requires a literal hosted label
  # in runs-on, so the runner a job lands on is readable from this file alone.
  test-arm:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked
